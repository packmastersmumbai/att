                        hi: 'इस विज़िटर के वापसी योग्य सामान अभी बाहर हैं। चेक-आउट जारी रखें?' },
  gp_checkout_reason: { en: 'Reason for override',   hi: 'ओवरराइड का कारण' }
};

/* The safety induction, grouped by SQCDP. Defined ONCE here because both vreg
   (which gates registration on it) and vpass (which reprints it) need the same
   list — they each used to hardcode their own copy of the key array, so adding
   a rule silently updated one page and not the other.

   Bump QRATT_SAFETY_VERSION whenever the wording or the list changes: it is
   stored against each visitor's acknowledgement, so a signature always says
   WHICH rules were agreed to. A timestamp alone is unattributable once the
   rules are edited. */
var QRATT_SAFETY_VERSION = '2026-09-06.sqcdp.v1';
var QRATT_SAFETY_SECTIONS = [
  { key: 'sqcdp_s', rules: ['safety_rule_1','safety_rule_2','safety_rule_3','safety_rule_4',
                            'safety_rule_5','safety_rule_6','safety_rule_7','safety_rule_8'] },
  { key: 'sqcdp_q', rules: ['safety_rule_9','safety_rule_10','safety_rule_11'] },
  { key: 'sqcdp_c', rules: ['safety_rule_12','safety_rule_13'] },
  { key: 'sqcdp_d', rules: ['safety_rule_14','safety_rule_15'] },
  { key: 'sqcdp_p', rules: ['safety_rule_16','safety_rule_17','safety_rule_18','safety_rule_19'] }
];
/** Every rule key, in display order. */
function qrattSafetyRuleKeys(){
  return QRATT_SAFETY_SECTIONS.reduce(function(a, s){ return a.concat(s.rules); }, []);
}

(function(){
  function lang(){ return sessionStorage.getItem('qratt_lang') === 'hi' ? 'hi' : 'en'; }
  window.qrattLang = lang;
  window.qrattT = function(key){ var e = QRATT_I18N[key]; if(!e) return key; return e[lang()] != null ? e[lang()] : e.en; };
  window.qrattApplyLang = function(){
    document.querySelectorAll('[data-i18n]').forEach(function(n){ n.textContent = qrattT(n.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(n){ n.setAttribute('placeholder', qrattT(n.getAttribute('data-i18n-ph'))); });
    document.documentElement.setAttribute('lang', lang());
    document.querySelectorAll('[data-lang-btn]').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang-btn') === lang());
    });
  };
  window.qrattSetLang = function(code){ sessionStorage.setItem('qratt_lang', code === 'hi' ? 'hi' : 'en'); qrattApplyLang(); };
  document.addEventListener('DOMContentLoaded', function(){
    var u = new URLSearchParams(location.search).get('lang');
    if (u === 'hi' || u === 'en') sessionStorage.setItem('qratt_lang', u);
    qrattApplyLang();
  });
})();
</script>
