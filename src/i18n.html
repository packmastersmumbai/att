(function(){
  function lang(){ return sessionStorage.getItem('qratt_lang') === 'hi' ? 'hi' : 'en'; }
  window.qrattLang = lang;
  window.qrattT = function(key){ var e = QRATT_I18N[key]; if(!e) return key; return e[lang()] != null ? e[lang()] : e.en; };
  window.qrattApplyLang = function(){
    document.querySelectorAll('[data-i18n]').forEach(function(n){ n.textContent = qrattT(n.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(n){ n.setAttribute('placeholder', qrattT(n.getAttribute('data-i18n-ph'))); });
    document.documentElement.setAttribute('lang', lang());
    document.querySelectorAll('[data-lang-btn]').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang-btn') === lang());
    });
  };
  window.qrattSetLang = function(code){ sessionStorage.setItem('qratt_lang', code === 'hi' ? 'hi' : 'en'); qrattApplyLang(); };
  document.addEventListener('DOMContentLoaded', function(){
    var u = new URLSearchParams(location.search).get('lang');
    if (u === 'hi' || u === 'en') sessionStorage.setItem('qratt_lang', u);
    qrattApplyLang();
  });
})();
