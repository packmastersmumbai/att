<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title><?= orgName ?> — Training</title>
<style>
  /* Held in a trainer's hand, shown to a group standing at a machine. Not a
     projector: portrait, one thing per screen, and the advance control where
     a thumb already is. Everything sized to be read by someone at arm's
     length over the trainer's shoulder, in plant lighting. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);
    font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}

  .wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:14px 16px 0}

  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding-bottom:10px}
  .brand{font-weight:800;color:var(--color-primary);font-size:14px;line-height:1.25}
  .brand small{display:block;font-weight:500;font-size:10px;color:var(--color-text-muted);
    letter-spacing:.6px;text-transform:uppercase}
  .stamp{font:600 10px var(--font-mono);color:var(--color-text-muted);text-align:right;
    max-width:48%;line-height:1.35}

  /* Where we are in thirty rules. A trainer needs to know how much is left
     before deciding to start; a worker needs to see it ending. */
  .prog{display:flex;gap:3px;margin-bottom:14px;flex-shrink:0}
  .prog i{flex:1;height:4px;border-radius:2px;background:var(--color-border)}
  .prog i.done{background:var(--color-primary)}
  .prog i.now{background:var(--color-primary);opacity:.45}

  .card{background:var(--color-surface);border:1px solid var(--color-border);
    border-radius:var(--radius-md);padding:18px;margin-bottom:14px}
  h1{font-size:20px;font-weight:800;line-height:1.25;margin-bottom:4px}
  .sub{font-size:14px;color:var(--color-text-muted)}

  /* ---- the rule screen ---------------------------------------------- */

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding-bottom:12px}

  .cat{font:700 11px var(--font-sans);letter-spacing:1.2px;text-transform:uppercase;
    color:var(--color-text-muted);text-align:center;margin-bottom:10px}

  /* The picture carries the rule for anyone who reads slowly. Given the most
     space on the screen for that reason, not for decoration. */
  .art{width:100%;max-width:230px;aspect-ratio:1;margin:0 auto 18px;
    display:grid;place-items:center;color:var(--color-primary);
    background:var(--color-surface);border:1px solid var(--color-border);
    border-radius:var(--radius-md);padding:26px;position:relative}
  .art svg{width:100%;height:100%}
  .art img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--radius-md) - 1px)}
  /* A photo of the actual stair beats any pictogram. Until someone walks the
     plant with a phone there are none, so the drawing stands in and the slot
     stays ready. */
  .art .swap{position:absolute;right:8px;bottom:8px;font:600 10px var(--font-mono);
    color:var(--color-text-muted)}

  /* Hindi first and largest: it is the language the room actually thinks in,
     and the trainer reads it aloud. English sits under it for the record,
     the supervisor and the auditor. */
  .hi{font-size:26px;font-weight:700;line-height:1.45;text-align:center;
    margin-bottom:10px}
  .en{font-size:17px;line-height:1.45;text-align:center;color:var(--color-text-muted)}

  /* The line being spoken. Sentence-level, driven by the clip's own cues —
     there are no per-word timings and pretending otherwise would drift. */
  .hi .s, .en .s{transition:color .15s,background-color .15s;border-radius:4px;
    padding:0 2px}
  .hi .s.on{background:rgba(0,6,102,.10);color:var(--color-primary)}
  .en .s.on{background:rgba(0,6,102,.08);color:var(--color-text)}

  /* ---- audio bar ----------------------------------------------------- */

  .aud{display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:44px;font-size:14px;color:var(--color-text-muted);margin-top:14px}
  .aud button{border:1px solid var(--color-border);background:var(--color-surface);
    color:var(--color-text);border-radius:var(--radius-md);
    font:700 14px var(--font-sans);padding:10px 16px;min-height:44px;cursor:pointer}
  .bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
  .bars i{width:3px;background:var(--color-primary);border-radius:1px;
    animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(1){height:6px;animation-delay:0s}
  .bars i:nth-child(2){height:13px;animation-delay:.15s}
  .bars i:nth-child(3){height:9px;animation-delay:.3s}
  @keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
  @media (prefers-reduced-motion:reduce){.bars i{animation:none}}

  /* ---- the bar the thumb lives on ------------------------------------ */

  .nav{position:sticky;bottom:0;background:var(--color-bg);
    border-top:1px solid var(--color-border);
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center}
  .nav .count{font:700 13px var(--font-mono);color:var(--color-text-muted);
    min-width:56px;text-align:center}

  .btn{flex:1;border:0;border-radius:var(--radius-md);background:var(--color-primary);
    color:#fff;font:800 18px var(--font-sans);padding:16px;min-height:56px;cursor:pointer}
  .btn:disabled{opacity:.45}
  .btn-ghost{background:var(--color-surface);color:var(--color-text);
    border:1px solid var(--color-border);font-weight:600;font-size:16px;flex:0 0 auto;
    padding:16px 18px}
  .btn:focus-visible,.btn-ghost:focus-visible,.aud button:focus-visible,
  .opt:focus-visible,.who:focus-visible{outline:3px solid var(--color-primary);
    outline-offset:2px}

  /* ---- attendees ------------------------------------------------------ */

  .who{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--color-surface);border:2px solid var(--color-border);
    border-radius:var(--radius-md);padding:13px 14px;margin-bottom:8px;
    font:500 17px var(--font-sans);color:var(--color-text);cursor:pointer;min-height:56px}
  .who[aria-pressed="true"]{border-color:var(--color-primary);background:rgba(0,6,102,.06);
    font-weight:700}
  .who .mark{width:26px;height:26px;border-radius:6px;flex-shrink:0;
    border:2px solid var(--color-border);display:grid;place-items:center;
    font:800 14px var(--font-mono);color:transparent}
  .who[aria-pressed="true"] .mark{border-color:var(--color-primary);
    background:var(--color-primary);color:#fff}
  .who .rid{font:600 12px var(--font-mono);color:var(--color-text-muted);margin-left:auto}
  .picked{font-size:14px;color:var(--color-text-muted);margin-bottom:10px}

  /* ---- the group question -------------------------------------------- */

  .qn{font:700 13px var(--font-mono);color:var(--color-text-muted);margin-bottom:8px;
    text-align:center}
  .qt-hi{font-size:22px;font-weight:700;line-height:1.4;margin-bottom:6px;text-align:center}
  .qt-en{font-size:15px;color:var(--color-text-muted);line-height:1.4;
    margin-bottom:18px;text-align:center}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--color-surface);border:2px solid var(--color-border);
    border-radius:var(--radius-md);padding:16px;margin-bottom:10px;
    font:500 18px var(--font-sans);color:var(--color-text);cursor:pointer;min-height:64px}
  .opt .mark{width:28px;height:28px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--color-border);display:grid;place-items:center;
    font:800 14px var(--font-mono);color:transparent}
  .opt[aria-pressed="true"]{border-color:var(--color-primary);background:rgba(0,6,102,.06);
    font-weight:700}
  .opt[aria-pressed="true"] .mark{border-color:var(--color-primary);
    background:var(--color-primary);color:#fff}
  .opt .sub-en{display:block;font-size:13px;font-weight:400;
    color:var(--color-text-muted);margin-top:2px}

  .res-score{font:800 52px/1 var(--font-mono);text-align:center;margin-bottom:8px}
  .note{font-size:14px;color:var(--color-text-muted);margin-top:12px;padding-top:12px;
    border-top:1px solid var(--color-border)}
  .err{background:#fee2e2;color:#b91c1c;border-radius:var(--radius-md);
    padding:12px 14px;font-size:15px;font-weight:600;margin-bottom:12px}
  .ok{background:#ecfdf5;color:#065f46;border-radius:var(--radius-md);
    padding:12px 14px;font-size:15px;font-weight:600;margin-bottom:12px}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <div class="brand"><?= orgName ?><small>Training</small></div>
    <div class="stamp"><?= isoInduction ?></div>
  </div>

  <!-- ============ 1. who is in the room ============ -->
  <div id="vWho">
    <!-- Filled from the topic once the module loads: this page serves any
         topic with a module, not only the induction. -->
    <div class="card">
      <h1 id="tTitle">Loading…</h1>
      <p class="sub" id="tSub">&nbsp;</p>
    </div>
    <div class="card">
      <p class="picked" id="picked">Tap everyone who is here.</p>
      <div id="roster">Loading…</div>
    </div>
  </div>

  <!-- ============ 2. the rules ============ -->
  <div id="vRules" hidden>
    <div class="prog" id="prog"></div>
    <div class="stage">
      <div class="cat" id="cat"></div>
      <div class="art" id="art"></div>
      <div class="hi" id="ruleHi"></div>
      <div class="en" id="ruleEn"></div>
      <div class="aud" id="aud"></div>
    </div>
  </div>

  <!-- ============ 3. the group test ============ -->
  <div id="vTest" hidden>
    <div class="prog" id="qprog"></div>
    <div class="stage">
      <div class="qn" id="qn"></div>
      <div class="qt-hi" id="qtHi"></div>
      <div class="qt-en" id="qtEn"></div>
      <div id="opts"></div>
    </div>
  </div>

  <!-- ============ 4. done ============ -->
  <div id="vDone" hidden>
    <div class="card">
      <div id="doneMsg"></div>
      <div class="res-score" id="doneScore"></div>
      <p class="sub" style="text-align:center" id="doneLine"></p>
      <!-- The honest record. A group answered together, so attendance is
           real evidence and an individual score is not — it is left blank,
           which this app already reads as "not assessed" rather than zero. -->
      <p class="note" id="doneNote"></p>
    </div>
    <button class="btn" onclick="restart()">Start another group</button>
  </div>

  <!-- one bar, three meanings, always under the thumb -->
  <div class="nav" id="nav">
    <button class="btn-ghost" id="bBack" onclick="back()" hidden>‹</button>
    <span class="count" id="count"></span>
    <button class="btn" id="bNext" onclick="next()">Start</button>
  </div>

</div>

<script>
/* Server-injected, via the raw printing scriptlet rather than the escaping
   one: the escaping form mangles a URL or a token inside a JS string.

   Do NOT write those two scriptlet forms out literally in a comment here.
   The template parser does not care that it is inside a comment — it sees
   the tag, finds an empty expression, and the WHOLE PROJECT fails to load
   with "SyntaxError: Unexpected token ';' (line 156, file Code)". The line
   and file in that message point at doGet's template.evaluate() call, not at
   this page, so it reads like a fault in Code.js and every other page keeps
   working. It cost three deploys to find. */
var TOPIC   = '<?!= presentTopicId ?>' || 'TRN-IND';
var PLAN_ID = '<?!= presentPlanId ?>';

/* Asked for at the END, once, when there is something to save — never taken
   from the URL. The admin token is a six-hour bearer credential for every
   privileged write in this app; in a link it would sit in the history of a
   shared plant phone and in any QR code printed beside it. Held in memory
   only, so closing the page drops it. */
var TOKEN = '';

var el = function (id) { return document.getElementById(id); };

var MOD = null;        // the module from the sheet
var RULES = [];        // [{cat, en, hi}]
var QS = [];           // [{n, text, options, hi:{text,options}}]
var ROSTER = [];       // active employees
var HERE = {};         // empId -> true
var IDX = 0;           // rule on screen
var QIDX = 0;          // question on screen
var ANS = [];          // the group's answer per question
var VIEW = 'who';
var HEADING = null;    // the topic's own name, from getTopicHeading

/* The heading and the module arrive in whichever order the two calls return,
   and the subtitle needs both — the name from one, the counts from the other.
   Called by each as it lands; renders only what it has. */
function renderHeading() {
  if (!HEADING) return;
  el('tTitle').textContent = HEADING.title;
  document.title = HEADING.title;

  var bits = [];
  if (HEADING.titleHi) bits.push(HEADING.titleHi);
  if (MOD) {
    bits.push(RULES.length + (RULES.length === 1 ? ' point' : ' points'));
    bits.push(QS.length + ' questions together');
    if (!MOD.reviewed) bits.push('draft');
  }
  el('tSub').textContent = bits.join(' · ');
}

/* ---------- loading ---------- */

function boot() {
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success) return fail('No module defined for ' + TOPIC);
      MOD = r.module;
      RULES = (MOD.sectionsHi.length ? MOD.sectionsHi : MOD.sections)
        .map(function (s, i) {
          var en = MOD.sections[i] || { heading: s.heading, body: '' };
          return { cat: s.heading || en.heading, hi: MOD.sectionsHi.length ? s.body : '', en: en.body };
        });
      QS = MOD.questions.map(function (q, i) {
        return { n: q.n, text: q.text, options: q.options, hi: MOD.questionsHi[i] || null };
      });
      renderHeading();
      render();
    })
    .withFailureHandler(function (e) { fail(e.message); })
    .getTrainingModule(TOPIC);

  /* The topic's own name. Separate call because the module carries content,
     not headings — and the page must not hardcode one topic's title when it
     serves any of them. */
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success) { el('tTitle').textContent = TOPIC; return; }
      HEADING = r;
      renderHeading();
    })
    .withFailureHandler(function () { el('tTitle').textContent = TOPIC; })
    .getTopicHeading(TOPIC);

  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success) return;
      ROSTER = (r.data || []).filter(function (p) {
        return String(p.Status || '').toUpperCase() !== 'INACTIVE';
      });
      renderRoster();
    })
    .withFailureHandler(function () { el('roster').textContent = 'Could not load the roster.'; })
    .getEmployees();

  loadClips();
}

function fail(msg) {
  el('roster').innerHTML = '<div class="err">' + msg + '</div>';
}

/* ---------- audio ----------
   The manifest carries Drive file ids, not URLs, and the bytes come back
   through this app: from inside the sandboxed iframe the drive.google.com/uc
   hop is unreliable and the browser reports a media error while the file is
   perfectly fine. Same approach vreg.html already uses at the gate. */

var CLIPS = {}, AU = null, BLOBS = {};

function loadClips() {
  google.script.run
    .withSuccessHandler(function (r) { if (r && r.success) { CLIPS = r.clips || {}; if (VIEW === 'rules') renderRule(); } })
    .withFailureHandler(function () { /* no audio is not an error */ })
    .getInductionAudio(TOPIC + '/');
}

/* The clip for the rule on screen.

   Names are ZERO-PADDED — TRN-IND/R01/hi, not R1. Building the unpadded form
   silently matched only rules 10-30 and left the first nine mute, which looks
   like nine missing recordings rather than an off-by-a-character. Both forms
   are tried so a clip uploaded either way still plays.

   Hindi first: it is the language the room is being addressed in. English is
   the fallback, not the default. */
function clipFor(i) {
  var n = i + 1, pad = (n < 10 ? '0' : '') + n;
  return CLIPS[TOPIC + '/R' + pad + '/hi'] || CLIPS[TOPIC + '/R' + n + '/hi'] ||
         CLIPS[TOPIC + '/R' + pad + '/en'] || CLIPS[TOPIC + '/R' + n + '/en'] || null;
}

function withClipUrl(id, ok, no) {
  if (BLOBS[id]) return ok(BLOBS[id]);
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success || !r.base64) return no();
      try {
        var bin = atob(r.base64), buf = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        BLOBS[id] = URL.createObjectURL(new Blob([buf], { type: r.mime || 'audio/mp4' }));
        ok(BLOBS[id]);
      } catch (e) { no(); }
    })
    .withFailureHandler(no)
    .getInductionClipData(id);
}

function stopAudio() {
  if (AU) { try { AU.pause(); } catch (e) {} AU = null; }
  clearHighlight();
}

function playRule() {
  var clip = clipFor(IDX);
  if (!clip || !clip.id) { el('aud').innerHTML = ''; return; }
  stopAudio();
  el('aud').innerHTML = '<span>🔊</span><span>Loading…</span>';
  withClipUrl(clip.id, function (url) {
    if (VIEW !== 'rules') return;             // moved on while it loaded
    AU = new Audio(url);
    AU.addEventListener('timeupdate', function () { highlight(clip.cues, AU.currentTime); });
    AU.addEventListener('ended', function () { clearHighlight(); audDone(); });
    AU.addEventListener('error', audNone);
    el('aud').innerHTML = '<span class="bars"><i></i><i></i><i></i></span><span>Playing</span>' +
      '<button type="button" onclick="stopAudio();audDone()">Stop</button>';
    AU.play().catch(audNone);
  }, audNone);
}

function audDone() { el('aud').innerHTML = '<button type="button" onclick="playRule()">🔊 Play again</button>'; }
function audNone() { el('aud').innerHTML = ''; }

/* Sentence highlighting, driven by the clip's own cue list. cues[i] is the
   start time of sentence i. No cues means no highlight — the rule is still
   on screen and still spoken, which is the whole point. A wrong highlight
   would be worse than none. */
function highlight(cues, t) {
  if (!cues || !cues.length) return;
  var at = -1;
  for (var i = 0; i < cues.length; i++) if (t >= cues[i]) at = i;
  paint(at);
}

function clearHighlight() { paint(-1); }

function paint(at) {
  ['ruleHi', 'ruleEn'].forEach(function (id) {
    var spans = el(id).getElementsByClassName('s');
    for (var i = 0; i < spans.length; i++) {
      if (i === at) spans[i].classList.add('on'); else spans[i].classList.remove('on');
    }
  });
}

/* Split on sentence enders, keeping the terminator on the sentence it ends —
   Devanagari danda included, since the Hindi is what gets read aloud.

   Written without a lookbehind on purpose. `split(/(?<=[।.!?])\s+/)` is the
   obvious form and works in Node, but the Apps Script parser rejects it
   OUTRIGHT: the whole project then fails to load with a SyntaxError
   attributed to Code.js, and every page goes down, not just this one. One
   unsupported character cost a deploy here; walking the string costs
   nothing.

   Known limit: "Dr. Smith" splits at the abbreviation. No rule in any module
   contains one, and the cost is a highlight that changes a beat early on a
   line still fully on screen — not worth an abbreviation dictionary. */
function sentences(txt) {
  var s = String(txt || ''), out = [], start = 0;
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    if (c !== '।' && c !== '.' && c !== '!' && c !== '?') continue;
    // Consume the terminator plus any run of spaces after it.
    var j = i + 1;
    while (j < s.length && /\s/.test(s.charAt(j))) j++;
    if (j === i + 1 && j < s.length) continue;   // mid-sentence dot, not an end
    out.push(s.slice(start, i + 1).trim());
    start = j;
    i = j - 1;
  }
  if (start < s.length) out.push(s.slice(start).trim());
  return out.filter(function (x) { return x; });
}

function asSpans(txt) {
  return sentences(txt).map(function (s) {
    return '<span class="s">' + esc(s) + '</span>';
  }).join(' ') || esc(txt);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- roster ---------- */

function renderRoster() {
  if (!ROSTER.length) { el('roster').textContent = 'No active employees.'; return; }
  el('roster').innerHTML = ROSTER.map(function (p) {
    var id = String(p.EmpID);
    return '<button class="who" type="button" aria-pressed="false" data-emp="' + esc(id) + '" ' +
      'onclick="toggleWho(this)"><span class="mark">✓</span>' +
      '<span>' + esc(p.Name || id) + '</span>' +
      '<span class="rid">' + esc(id) + '</span></button>';
  }).join('');
  renderPicked();
}

function toggleWho(btn) {
  var id = btn.getAttribute('data-emp');
  if (HERE[id]) { delete HERE[id]; btn.setAttribute('aria-pressed', 'false'); }
  else { HERE[id] = true; btn.setAttribute('aria-pressed', 'true'); }
  renderPicked();
}

function countHere() { return Object.keys(HERE).length; }

function renderPicked() {
  var n = countHere();
  el('picked').textContent = n
    ? n + (n === 1 ? ' person is here.' : ' people are here.')
    : 'Tap everyone who is here.';
  el('bNext').disabled = !n;
}

/* ---------- rendering ---------- */

function render() {
  ['vWho', 'vRules', 'vTest', 'vDone'].forEach(function (v) { el(v).hidden = true; });
  el('bBack').hidden = true;
  el('count').textContent = '';
  el('bNext').hidden = false;
  el('bNext').disabled = false;

  if (VIEW === 'who')   { el('vWho').hidden = false;   el('bNext').textContent = 'Start'; renderPicked(); }
  if (VIEW === 'rules') { el('vRules').hidden = false; renderRule(); }
  if (VIEW === 'test')  { el('vTest').hidden = false;  renderQ(); }
  if (VIEW === 'done')  { el('vDone').hidden = false;  el('bNext').hidden = true; }
}

function renderRule() {
  var r = RULES[IDX];
  if (!r) return;

  el('prog').innerHTML = RULES.map(function (_, i) {
    return '<i class="' + (i < IDX ? 'done' : i === IDX ? 'now' : '') + '"></i>';
  }).join('');

  el('cat').textContent = r.cat || '';
  el('ruleHi').innerHTML = asSpans(r.hi);
  el('ruleEn').innerHTML = asSpans(r.en);

  var sym = window.qrattPictogram ? window.qrattPictogram(r.en, r.hi) : 'pg-rule';
  el('art').innerHTML = '<svg aria-hidden="true"><use href="#' + sym + '"></use></svg>';

  el('count').textContent = (IDX + 1) + '/' + RULES.length;
  el('bBack').hidden = IDX === 0;
  el('bNext').textContent = (IDX === RULES.length - 1) ? 'Questions ›' : 'Next ›';

  playRule();
}

function renderQ() {
  var q = QS[QIDX];
  if (!q) return;

  el('qprog').innerHTML = QS.map(function (_, i) {
    return '<i class="' + (i < QIDX ? 'done' : i === QIDX ? 'now' : '') + '"></i>';
  }).join('');

  el('qn').textContent = 'Question ' + (QIDX + 1) + ' of ' + QS.length;
  el('qtHi').textContent = q.hi ? q.hi.text : q.text;
  el('qtEn').textContent = q.hi ? q.text : '';

  el('opts').innerHTML = q.options.map(function (o, i) {
    var hi = q.hi && q.hi.options[i];
    return '<button class="opt" type="button" aria-pressed="' + (ANS[QIDX] === i) + '" ' +
      'onclick="pick(' + i + ')"><span class="mark">✓</span><span>' +
      esc(hi || o) + (hi ? '<span class="sub-en">' + esc(o) + '</span>' : '') +
      '</span></button>';
  }).join('');

  el('count').textContent = (QIDX + 1) + '/' + QS.length;
  el('bBack').hidden = false;
  el('bNext').disabled = ANS[QIDX] === undefined;
  el('bNext').textContent = (QIDX === QS.length - 1) ? 'Finish' : 'Next ›';
}

function pick(i) { ANS[QIDX] = i; renderQ(); }

/* ---------- navigation ---------- */

function next() {
  if (VIEW === 'who')   { VIEW = 'rules'; IDX = 0; return render(); }
  if (VIEW === 'rules') {
    stopAudio();
    if (IDX < RULES.length - 1) { IDX++; return renderRule(); }
    VIEW = 'test'; QIDX = 0; return render();
  }
  if (VIEW === 'test') {
    if (QIDX < QS.length - 1) { QIDX++; return renderQ(); }
    return submit();
  }
}

function back() {
  if (VIEW === 'rules') {
    stopAudio();
    if (IDX > 0) { IDX--; return renderRule(); }
    VIEW = 'who'; return render();
  }
  if (VIEW === 'test') {
    if (QIDX > 0) { QIDX--; return renderQ(); }
    VIEW = 'rules'; IDX = RULES.length - 1; return render();
  }
}

/* ---------- the record ---------- */

/**
 * Save, asking for the PIN first if we do not already hold a token.
 *
 * Asked HERE and not at the start: the rules are worth showing to a group
 * whether or not anyone can record it, and a PIN prompt in front of the very
 * first screen is how a trainer gives up and briefs them off paper instead.
 * By this point there is something real to save.
 */
function submit() {
  if (TOKEN) return doSave();

  var pin = window.prompt('Admin PIN to record this session');
  if (pin === null) return;                       // cancelled: nothing is lost
  if (!pin) return submit();

  el('bNext').disabled = true;
  el('bNext').textContent = 'Checking…';

  google.script.run
    .withSuccessHandler(function (v) {
      if (!v || !v.success || !v.token) {
        el('bNext').disabled = false;
        el('bNext').textContent = 'Finish';
        window.alert('That PIN was not accepted.');
        return;
      }
      TOKEN = v.token;
      doSave();
    })
    .withFailureHandler(function (e) {
      el('bNext').disabled = false;
      el('bNext').textContent = 'Finish';
      window.alert('Could not check the PIN: ' + (e && e.message));
    })
    .verifyPIN(pin);
}

function doSave() {
  stopAudio();
  el('bNext').disabled = true;
  el('bNext').textContent = 'Saving…';

  var rows = Object.keys(HERE).map(function (id) {
    var p = ROSTER.filter(function (e) { return String(e.EmpID) === id; })[0] || {};
    /* Present, with NO score.
       The room answered together. Writing the group's percentage onto each
       person would assert eight individual assessments that never happened,
       and every count downstream — coverage, pass rate, the matrix — would
       read it as exactly that. saveSessionAttendance already treats a blank
       score as "not assessed", which is the true state after a group session.
       The group's own result goes on the SESSION, below, where it belongs. */
    return { empId: id, name: p.Name || '', present: true, score: '' };
  });

  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success) return saveFailed(r && r.error);
      done(r);
    })
    .withFailureHandler(function (e) { saveFailed(e.message); })
    .savePresentedSession({
      planId: PLAN_ID, topicId: TOPIC,
      rows: rows, answers: ANS, lang: 'hi'
    }, TOKEN);
}

/* A failed save must NOT end the session. The room is still standing there
   and the answers are still in memory — dropping them would mean walking the
   whole group through thirty rules again. Stay on the last question with the
   button live, so Finish is simply tapped again. */
function saveFailed(msg) {
  var unauthorized = /unauthori[sz]ed/i.test(String(msg || ''));
  if (unauthorized) TOKEN = '';          // ask for the PIN again on retry

  el('bNext').disabled = false;
  el('bNext').textContent = 'Finish';
  window.alert('Not saved: ' + (msg || 'unknown error') +
    '\n\nNothing is lost — tap Finish to try again.');
}

function done(r) {
  VIEW = 'done'; render();
  var n = countHere();
  el('doneMsg').innerHTML = '<div class="ok">Recorded for ' + n +
    (n === 1 ? ' person' : ' people') + '</div>';
  el('doneScore').textContent = r.correct + '/' + r.total;
  el('doneLine').textContent = 'The group answered ' + r.correct + ' of ' + r.total + ' correctly.';
  el('doneNote').textContent =
    'Attendance is recorded for each person. The group result is on the session, ' +
    'not on anyone individually — attendance is not evidence of competence. ' +
    'Each person is assessed on their own at reassessment.';
}

function restart() {
  HERE = {}; ANS = []; IDX = 0; QIDX = 0; VIEW = 'who';
  renderRoster(); render();
}

document.addEventListener('DOMContentLoaded', boot);
</script>

<!-- The pictogram <symbol> defs and the rule-to-picture matcher are injected
     by doGet, the same way tokens/i18n/gatepassCard are. Calling
     HtmlService from inside the template works only without a trailing
     semicolon — a printing scriptlet is an expression — and the failure is a
     server-side SyntaxError attributed to Code.js, not to this file. Not
     worth the trap for a fragment doGet is already in the business of
     injecting. -->
</body>
</html>
