<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Visitor Pass</title>
  <style>
    :root{
      --primary:#006b5f; --green:#16a34a; --green-dk:#15803d;
      --pink:#be185d; --danger:#dc2626;
      --bg:#0d1b2a; --surface:#13233a; --text:#f1f5f9; --muted:#94a3b8; --border:rgba(255,255,255,.12);
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:18px}
    .wrap{max-width:380px;width:100%}
    .head{text-align:center;margin:8px 0 16px}
    .head .t1{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
    .head .t2{font-size:20px;font-weight:800;margin-top:2px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
      padding:20px;text-align:center}
    .name{font-size:20px;font-weight:800}
    .sub{font-size:13px;color:var(--muted);margin-top:2px}
    .qrbox{background:#fff;border-radius:14px;padding:14px;display:inline-block;margin:16px 0 10px}
    .qrbox img{display:block;width:200px;height:200px}
    .vid{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
    .status{display:inline-flex;align-items:center;gap:7px;margin:14px 0 4px;
      padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.5px}
    .status.in{background:rgba(22,163,74,.16);color:#4ade80}
    .status.out{background:rgba(148,163,184,.16);color:#cbd5e1}
    .status .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
    .btn{width:100%;margin-top:16px;padding:16px;border:none;border-radius:12px;
      font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;color:#fff;transition:background .15s}
    .btn.checkin{background:var(--green)} .btn.checkin:hover{background:var(--green-dk)}
    .btn.checkout{background:var(--pink)} .btn.checkout:hover{background:#9d174d}
    .btn:disabled{opacity:.6;cursor:default}
    .hint{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}
    .err{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.4);color:#fca5a5;
      border-radius:10px;padding:14px;font-size:13px;text-align:center}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
      background:#0f172a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
      opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;border:1px solid var(--border)}
    .toast.show{opacity:1}

    /* Exit reminder (mirrors the paper pass instruction) */
    .exit-note{margin-top:12px;padding:9px 10px;border-radius:8px;font-size:11.5px;line-height:1.6;
      font-weight:700;color:#fcd34d;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35)}

    /* Emergency contacts — tap to call */
    .emg{margin-top:12px;background:rgba(220,38,38,.10);border:1px solid rgba(248,113,113,.45);
      border-radius:12px;padding:12px}
    .emg-hd{font-size:12px;font-weight:800;color:#fca5a5;margin-bottom:9px;letter-spacing:.3px}
    .emg-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;
      background:rgba(15,23,42,.55);border:1px solid rgba(248,113,113,.30);border-radius:9px;
      padding:11px 12px;margin-bottom:7px;text-decoration:none}
    .emg-btn:last-child{margin-bottom:0}
    .emg-lbl{font-size:12.5px;font-weight:700;color:#f1f5f9}
    .emg-num{font-size:13px;font-weight:800;color:#fca5a5;white-space:nowrap;letter-spacing:.4px}

    /* Safety rules — always readable, expanded by default */
    .rules-card{margin-top:12px;background:rgba(255,255,255,.03);border:1px solid var(--border);
      border-radius:12px;padding:12px}
    .rules-hd{display:flex;align-items:center;justify-content:space-between;cursor:pointer;
      font-size:12px;font-weight:800;color:#fcd34d;letter-spacing:.3px}
    .rules-body{margin:10px 0 0;padding-left:20px}
    .rules-body li{font-size:12px;line-height:1.6;color:#e2e8f0;margin-bottom:9px}
    .rules-body li:last-child{margin-bottom:0}
    .rules-body .en{display:block;color:#94a3b8;font-size:11px;margin-top:2px}

    /* Compact header language toggle (mirrors vreg.html) */
    .lang-toggle{display:flex;gap:6px;justify-content:center;margin-top:10px}
    .lang-btn{min-height:32px;padding:5px 12px;border:1px solid var(--border);border-radius:8px;
      background:rgba(255,255,255,.05);color:var(--text);font-size:11px;font-weight:700;cursor:pointer}
    .lang-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="t1"><?= orgName ?></div>
      <div class="t2">Visitor Pass</div>
      <div class="lang-toggle" id="langToggle">
        <button type="button" class="lang-btn" data-lang-btn="en" onclick="qrattSetLang('en')">EN</button>
        <button type="button" class="lang-btn" data-lang-btn="hi" onclick="qrattSetLang('hi')">हिं</button>
      </div>
    </div>
    <div id="root"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    var PASS = <?!= passJson ?>;

    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(function(){t.className='toast';},2400);}

    function render(p){
      var root=document.getElementById('root');
      if(!p || !p.success){
        root.innerHTML='<div class="err">'+esc((p&&p.error)||'Pass not found')+'</div>';
        return;
      }
      if(p.blacklisted){
        root.innerHTML='<div class="err">⛔ This visitor pass is blocked. Please contact reception.</div>';
        return;
      }
      var isIn = p.status==='IN';
      // Status/button/hint copy depends on check-in state, not just language, so each
      // carries a state-specific data-i18n key — a later qrattApplyLang() (triggered by
      // the language toggle) re-translates it correctly without needing a full re-render.
      var statusKey = isIn ? 'vpass_status_in' : 'vpass_status_out';
      var btnKey = isIn ? 'vpass_btn_checkout' : 'vpass_btn_checkin';
      var actionKey = isIn ? 'vpass_hint_checkout' : 'vpass_hint_checkin';
      var hint = qrattT('vpass_hint_tail').replace('{action}', qrattT(actionKey));
      root.innerHTML=
        '<div class="card">'+
          '<div class="name">'+esc(p.name)+'</div>'+
          '<div class="sub">'+esc(p.company||'')+(p.purpose?' · '+esc(p.purpose):'')+'</div>'+
          '<div class="qrbox"><img src="'+esc(p.qrUrl)+'" alt="QR"></div>'+
          '<div class="vid">'+esc(p.visitorId)+'</div>'+
          '<div class="status '+(isIn?'in':'out')+'"><span class="dot"></span>'+
            '<span data-i18n="'+statusKey+'">'+qrattT(statusKey)+'</span></div>'+
          '<button class="btn '+(isIn?'checkout':'checkin')+'" id="toggleBtn" onclick="toggle()" data-i18n="'+btnKey+'">'+
            qrattT(btnKey)+'</button>'+
          '<div class="hint">'+hint+'</div>'+
          '<div class="exit-note" data-i18n="vpass_exit_note">'+qrattT('vpass_exit_note')+'</div>'+
        '</div>'+
        renderEmergency()+
        renderSafetyRules();
      qrattApplyLang();   // re-apply i18n + toggle active-state after the DOM was rebuilt
    }

    /* ── Emergency contacts — tap to call. Always visible, above the rules,
          because in an emergency nobody scrolls. i18n key + phone number are
          fixed defaults (not visitor data), so a data-i18n key is used for
          the label and the number is rendered as plain esc()'d text. ── */
    var EMERGENCY_DEFAULTS = [
      { key:'vpass_emg_incharge',  num:'9136107776' },
      { key:'vpass_emg_main_gate', num:'9136107773' },
      { key:'vpass_emg_office',    num:'02240020855' }
    ];
    var EMERGENCY = EMERGENCY_DEFAULTS.slice();

    function renderEmergency(){
      return '<div class="emg">'+
        '<div class="emg-hd" data-i18n="vpass_emergency_title">🆘 '+qrattT('vpass_emergency_title')+'</div>'+
        EMERGENCY.map(function(c){
          return '<a class="emg-btn" href="tel:'+esc(c.num)+'">'+
                   '<span class="emg-lbl">📞 <span data-i18n="'+c.key+'">'+qrattT(c.key)+'</span></span>'+
                   '<span class="emg-num">'+esc(c.num)+'</span>'+
                 '</a>';
        }).join('')+
      '</div>';
    }

    /* ── Safety rules — ALWAYS readable (never hidden/blurred). This is the copy
          the visitor carries on site; obscuring it would be unsafe. Keys match
          the shared safety_rule_N dictionary entries (identical text on vreg). ── */
    var SAFETY_RULE_KEYS=['safety_rule_1','safety_rule_2','safety_rule_3','safety_rule_4',
                           'safety_rule_5','safety_rule_6','safety_rule_7'];

    function renderSafetyRules(){
      return '<div class="rules-card">'+
        '<div class="rules-hd" onclick="toggleRules()">'+
          '<span data-i18n="vpass_safety_rules_title">🦺 '+qrattT('vpass_safety_rules_title')+'</span>'+
          '<span id="rulesArrow">▾</span>'+
        '</div>'+
        '<ol id="rulesBody" class="rules-body">'+
          SAFETY_RULE_KEYS.map(function(key){
            return '<li data-i18n="'+key+'">'+qrattT(key)+'</li>';
          }).join('')+
        '</ol>'+
      '</div>';
    }
    function toggleRules(){
      var b=document.getElementById('rulesBody'), a=document.getElementById('rulesArrow');
      var open=b.style.display!=='none';
      b.style.display=open?'none':'block';
      a.textContent=open?'▸':'▾';
    }

    function toggle(){
      var btn=document.getElementById('toggleBtn');
      btn.disabled=true;
      btn.removeAttribute('data-i18n');   // showing transient "please wait" state, not the static label
      btn.textContent=qrattT('vpass_wait');
      if(typeof google==='undefined'||!google.script){ toast('Not in app context'); btn.disabled=false; return; }
      google.script.run
        .withSuccessHandler(function(res){
          if(!res||!res.success){ toast('Error: '+((res&&res.message)||(res&&res.error)||'failed')); render(PASS); return; }
          PASS.status = res.status;       // updated by selfCheckVisitor
          toast(res.status==='IN'?'Checked in ✓':'Checked out ✓');
          render(PASS);
        })
        .withFailureHandler(function(e){ toast('Error: '+(e&&e.message||'server')); render(PASS); })
        .selfCheckVisitor(PASS.visitorId);
    }

    render(PASS);
  </script>
</body>
</html>
