<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Calendar — QR Att.</title>
  <style>
    /* Colours, spacing and type all come from the shared tokens injected by
       doGet(); only what is specific to this page is declared here. */
    :root{
      --done:#0f766e; --done-bg:#ccfbf1;
      --due:#b45309;  --due-bg:#fef3c7;
      --late:#b91c1c; --late-bg:#fee2e2;
      --plan:#3730a3; --plan-bg:#eef2ff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);
      font-size:13px;line-height:1.45;display:flex}

    /* ── Sidebar (matches reports/visitors) ── */
    .sb{width:238px;flex-shrink:0;background:var(--color-surface);
      border-right:1px solid var(--color-border);display:flex;flex-direction:column}
    .sb-logo{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--color-border)}
    .sb-logo-icon{width:32px;height:32px;border-radius:var(--radius-md);background:var(--color-primary);
      color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
    .sb-logo-name{font-weight:800;font-size:16px;color:var(--color-primary);line-height:1}
    .sb-logo-sub{font-size:9px;color:var(--color-text-muted);letter-spacing:1.4px;text-transform:uppercase}
    .sb-nav{padding:12px 10px;flex:1}
    .sb-section{font-size:9px;font-weight:700;color:var(--color-text-muted);letter-spacing:1.2px;
      text-transform:uppercase;padding:8px 8px 4px}
    .sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-md);
      color:var(--color-text);text-decoration:none;font-size:13px;font-weight:500}
    .sb-item:hover{background:#f5f0ee}
    .sb-item.active{background:var(--color-primary);color:#fff}
    .sb-icon{width:17px;height:17px;flex-shrink:0}

    /* ── Main ── */
    .main{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
    .doc{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md)}
    .doc-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
      padding:14px 16px;border-bottom:1px solid var(--color-border);flex-wrap:wrap}
    .doc-t{font-size:16px;font-weight:800}
    .doc-meta{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);margin-top:2px}
    .ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .seg{display:flex;border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
    .seg button{border:0;background:var(--color-surface);color:var(--color-text-muted);cursor:pointer;
      font:600 11px var(--font-sans);padding:7px 12px;min-height:34px}
    .seg button[aria-pressed="true"]{background:var(--color-primary);color:#fff}
    .btn{border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);
      border-radius:var(--radius-md);font:600 11px var(--font-sans);padding:7px 12px;
      min-height:34px;cursor:pointer}
    .btn-pri{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
    .btn:disabled{opacity:.5;cursor:default}

    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      border-bottom:1px solid var(--color-border)}
    .kpi{padding:10px 16px;border-right:1px solid var(--color-border)}
    .kpi:last-child{border-right:0}
    .kpi-l{font-size:10px;font-weight:700;color:var(--color-text-muted);
      text-transform:uppercase;letter-spacing:.6px}
    .kpi-v{font:800 20px/1.1 var(--font-mono);margin-top:3px;font-variant-numeric:tabular-nums}
    .kpi-v.warn{color:var(--color-warning)} .kpi-v.bad{color:var(--color-danger)}

    .scroll{overflow-x:auto}
    table{border-collapse:collapse;width:100%;font-size:12px}
    th,td{border:1px solid var(--color-border);padding:6px 8px;text-align:left}
    thead th{background:var(--color-bg);font-size:10px;font-weight:700;color:var(--color-text-muted);
      text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
    .topic{min-width:230px;font-weight:600}
    .topic .n{font-family:var(--font-mono);color:var(--color-muted);margin-right:6px}
    .mth{width:54px;text-align:center;padding:4px}

    /* Status carries a glyph as well as a colour, so the grid survives a
       black-and-white print and is readable to a colour-blind auditor. */
    .cell{display:inline-flex;align-items:center;justify-content:center;gap:2px;
      font:700 11px var(--font-mono);padding:4px 6px;border-radius:var(--radius-md);
      min-width:42px;cursor:pointer;border:1px solid transparent;font-variant-numeric:tabular-nums}
    .cell:hover{border-color:var(--color-primary)}
    .c-done{background:var(--done-bg);color:var(--done)}
    .c-due {background:var(--due-bg); color:var(--due)}
    .c-late{background:var(--late-bg);color:var(--late)}
    .c-plan{background:var(--plan-bg);color:var(--plan)}
    .legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;font-size:11px;
      color:var(--color-text-muted);border-top:1px solid var(--color-border)}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .sw{width:12px;height:12px;border-radius:2px;display:inline-block;flex-shrink:0}
    .empty{padding:34px 16px;text-align:center;color:var(--color-text-muted);font-size:13px}

    /* ── Session panel ── */
    .backdrop{display:none;position:fixed;inset:0;background:rgba(2,6,16,.45);z-index:40}
    .backdrop.on{display:block}
    .panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;z-index:41;
      background:var(--color-surface);border-left:1px solid var(--color-border);
      transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column}
    .panel.on{transform:none}
    .panel-hd{padding:14px 16px;border-bottom:1px solid var(--color-border);
      display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .panel-b{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
    .fld{display:flex;flex-direction:column;gap:5px}
    .fld label{font-size:10px;font-weight:700;color:var(--color-text-muted);
      text-transform:uppercase;letter-spacing:.5px}
    .inp{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:8px 10px;
      font:400 13px var(--font-sans);background:var(--color-surface);color:var(--color-text);
      min-height:38px;width:100%}
    .inp:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(0,6,102,.10)}
    .agenda{background:var(--color-bg);border:1px solid var(--color-border);
      border-radius:var(--radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-muted)}
    .agenda b{display:block;color:var(--color-text);font-size:10px;text-transform:uppercase;
      letter-spacing:.5px;margin-bottom:5px}
    .agenda ul{margin:0 0 6px 16px}
    .agenda li{margin-bottom:2px}
    @media print{.sb,.ctrls,.panel,.backdrop{display:none!important}.main{padding:0}}
  </style>
</head>
<body>
  <aside class="sb">
    <div class="sb-logo">
      <div class="sb-logo-icon">QR</div>
      <div>
        <div class="sb-logo-name">QR Att.</div>
        <div class="sb-logo-sub">Attendance System</div>
      </div>
    </div>
    <nav class="sb-nav">
      <div class="sb-section">Operations</div>
      <a class="sb-item" href="?page=kiosk" data-page="kiosk">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/>
        </svg>
        Kiosk
      </a><a class="sb-item" href="?page=scanner" data-page="scanner">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><path d="M21 16h-3v3m0-3v3h-3"/></svg>
        Scanner
      </a>
      <a class="sb-item" href="?page=dashboard" data-page="dashboard">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
      <a class="sb-item" href="?page=reports" data-page="reports">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/>
        </svg>
        Reports
      </a>
      <a class="sb-item" href="?page=visitors" data-page="visitors">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Visitors
      </a>
      <a class="sb-item active" href="?page=training" data-page="training">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Training
      </a>
      <div class="sb-section" style="margin-top:8px">System</div>
      <a class="sb-item" href="?page=admin" data-page="admin">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/>
        </svg>
        Admin
      </a>
    </nav>
  </aside>

  <main class="main">
    <section class="doc">
      <div class="doc-hd">
        <div>
          <div class="doc-t">Annual Training Calendar <span id="hdYear">—</span></div>
          <div class="doc-meta">Format F-TR-01 · Rev 00 · <?= orgName ?></div>
        </div>
        <div class="ctrls">
          <div class="seg" id="yearSeg"></div>
          <div class="seg" id="typeSeg">
            <button type="button" data-type="TRAIN" aria-pressed="true">Training</button>
            <button type="button" data-type="DRILL" aria-pressed="false">Mock drill</button>
          </div>
          <button class="btn" onclick="window.print()">Print</button>
        </div>
      </div>

      <div class="kpis" id="kpis"></div>
      <div class="scroll"><table id="grid"></table></div>

      <div class="legend">
        <span><i class="sw" style="background:var(--done-bg);border:1px solid var(--done)"></i> Completed</span>
        <span><i class="sw" style="background:var(--due-bg);border:1px solid var(--due)"></i> Due this month</span>
        <span><i class="sw" style="background:var(--late-bg);border:1px solid var(--late)"></i> Overdue</span>
        <span><i class="sw" style="background:var(--plan-bg);border:1px solid var(--plan)"></i> Planned</span>
        <span>Number is the day of the month. Click a cell to open the session.</span>
      </div>
    </section>
  </main>

  <div class="backdrop" id="backdrop" onclick="closePanel()"></div>
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-hd">
      <div>
        <div style="font-weight:700;font-size:15px" id="pTitle">—</div>
        <div class="doc-meta" id="pMeta">—</div>
      </div>
      <button class="btn" onclick="closePanel()" aria-label="Close">&times;</button>
    </div>
    <div class="panel-b">
      <div class="agenda" id="pAgenda"></div>
      <div class="fld"><label for="pActual">Actual date</label>
        <input type="date" class="inp" id="pActual"></div>
      <div class="fld"><label for="pTrainer">Trainer</label>
        <input type="text" class="inp" id="pTrainer" placeholder="Who delivered it"></div>
      <div class="fld"><label for="pObs">Observations</label>
        <textarea class="inp" id="pObs" rows="3" placeholder="How it went"></textarea></div>
      <button class="btn btn-pri" id="pSave" onclick="saveSession()" style="min-height:42px">Save session</button>
      <div id="pMsg" style="font-size:12px;color:var(--color-text-muted)"></div>
    </div>
  </aside>

  <script>
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var DATA = { topics: [], plan: [], years: [], year: '' };
    var VIEW = 'TRAIN';
    var OPEN = null;

    function esc(s){ return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function post(payload, ok, fail) {
      google.script.run.withSuccessHandler(ok)
        .withFailureHandler(fail || function(e){ msg('Error: ' + (e && e.message)); })[payload.fn]
        .apply(null, payload.args);
    }

    function msg(t){ document.getElementById('pMsg').textContent = t || ''; }

    function load(year) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) return;
          DATA = res;
          document.getElementById('hdYear').textContent = res.year;
          renderYears();
          render();
        })
        .withFailureHandler(function (e) {
          document.getElementById('grid').innerHTML =
            '<tr><td class="empty">Could not load the calendar: ' + esc(e && e.message) + '</td></tr>';
        })
        .getTrainingCalendar(year || '');
    }

    function renderYears() {
      document.getElementById('yearSeg').innerHTML = (DATA.years || []).map(function (y) {
        return '<button type="button" onclick="load(\'' + y + '\')" aria-pressed="' +
               (String(y) === String(DATA.year)) + '">' + esc(y) + '</button>';
      }).join('');
    }

    /* One row per topic, one column per month. The cell shows the day number
       of whichever session falls in that month. */
    function render() {
      var topics = DATA.topics.filter(function (t) { return (t.Type || 'TRAIN') === VIEW; });
      var byTopic = {};
      DATA.plan.forEach(function (p) {
        if ((p.type || 'TRAIN') !== VIEW) return;
        (byTopic[p.topicId] = byTopic[p.topicId] || []).push(p);
      });

      var head = '<thead><tr><th class="topic">' +
        (VIEW === 'DRILL' ? 'Mock drill scenario' : 'Training topic') + '</th>' +
        MONTHS.map(function (m) { return '<th class="mth">' + m + '</th>'; }).join('') +
        '</tr></thead>';

      if (!topics.length) {
        document.getElementById('grid').innerHTML = head +
          '<tbody><tr><td class="empty" colspan="13">No ' +
          (VIEW === 'DRILL' ? 'drills' : 'topics') + ' yet. Seed the year from Admin.</td></tr></tbody>';
        renderKpis([]);
        return;
      }

      var body = topics.map(function (t, i) {
        var cells = new Array(12).fill('');
        (byTopic[t.TopicID] || []).forEach(function (p) {
          var shown = p.actualDate || p.plannedDate;
          if (!shown) return;
          var mi = Number(shown.slice(5, 7)) - 1;
          var day = shown.slice(8, 10);
          var cls = { DONE: 'c-done', DUE: 'c-due', OVERDUE: 'c-late', PLANNED: 'c-plan' }[p.status];
          var mark = { DONE: '✓', DUE: '◷', OVERDUE: '!', PLANNED: '' }[p.status];
          cells[mi] = '<span class="cell ' + cls + '" onclick="openPanel(\'' + p.planId + '\')" ' +
                      'title="' + esc(t.Title) + ' — ' + p.status.toLowerCase() + '">' +
                      mark + day + '</span>';
        });
        return '<tr><td class="topic"><span class="n">' + (i + 1) + '</span>' + esc(t.Title) + '</td>' +
               cells.map(function (c) { return '<td class="mth">' + c + '</td>'; }).join('') + '</tr>';
      }).join('');

      document.getElementById('grid').innerHTML = head + '<tbody>' + body + '</tbody>';
      renderKpis(DATA.plan.filter(function (p) { return (p.type || 'TRAIN') === VIEW; }));
    }

    function renderKpis(rows) {
      var done = rows.filter(function (r) { return r.status === 'DONE'; }).length;
      var overdue = rows.filter(function (r) { return r.status === 'OVERDUE'; }).length;
      var pct = rows.length ? Math.round(done / rows.length * 100) : 0;
      var hrs = 0;
      var byId = {};
      DATA.topics.forEach(function (t) { byId[t.TopicID] = t; });
      rows.forEach(function (r) {
        if (r.status === 'DONE') hrs += Number((byId[r.topicId] || {}).DurationHrs || 0);
      });

      document.getElementById('kpis').innerHTML = [
        ['Plan adherence', pct + '%', pct < 80 ? 'warn' : ''],
        ['Sessions', done + '/' + rows.length, ''],
        ['Overdue', String(overdue), overdue ? 'bad' : ''],
        ['Hours delivered', hrs.toFixed(1), '']
      ].map(function (k) {
        return '<div class="kpi"><div class="kpi-l">' + k[0] + '</div>' +
               '<div class="kpi-v ' + k[2] + '">' + k[1] + '</div></div>';
      }).join('');
    }

    document.getElementById('typeSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-type]');
      if (!b) return;
      VIEW = b.dataset.type;
      [].forEach.call(this.querySelectorAll('button'), function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      render();
    });

    function openPanel(planId) {
      var p = DATA.plan.filter(function (x) { return x.planId === planId; })[0];
      if (!p) return;
      var t = DATA.topics.filter(function (x) { return x.TopicID === p.topicId; })[0] || {};
      OPEN = p;

      document.getElementById('pTitle').textContent = t.Title || p.topicId;
      document.getElementById('pMeta').textContent =
        'Planned ' + (p.plannedDate || '—') + ' · ' + (t.DurationHrs || '?') + ' hrs';
      document.getElementById('pAgenda').innerHTML =
        '<b>Agenda — from the topic library</b><ul>' +
        String(t.Agenda || '').split('|').filter(Boolean)
          .map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') +
        '</ul>' + (t.Method ? 'Method: ' + esc(t.Method) : '');
      document.getElementById('pActual').value = p.actualDate || '';
      document.getElementById('pTrainer').value = p.trainer || '';
      document.getElementById('pObs').value = '';
      msg('');

      document.getElementById('panel').classList.add('on');
      document.getElementById('panel').setAttribute('aria-hidden', 'false');
      document.getElementById('backdrop').classList.add('on');
    }

    function closePanel() {
      document.getElementById('panel').classList.remove('on');
      document.getElementById('panel').setAttribute('aria-hidden', 'true');
      document.getElementById('backdrop').classList.remove('on');
      OPEN = null;
    }

    function saveSession() {
      if (!OPEN) return;
      var btn = document.getElementById('pSave');
      btn.disabled = true; msg('Saving…');
      google.script.run
        .withSuccessHandler(function (r) {
          btn.disabled = false;
          if (!r || !r.success) { msg((r && r.error) || 'Could not save'); return; }
          msg('Saved.');
          closePanel();
          load(DATA.year);
        })
        .withFailureHandler(function (e) { btn.disabled = false; msg('Error: ' + (e && e.message)); })
        .saveTrainingSession({
          planId: OPEN.planId,
          actualDate: document.getElementById('pActual').value,
          trainer: document.getElementById('pTrainer').value.trim(),
          observations: document.getElementById('pObs').value.trim()
        });
    }

    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });
    load('');
  </script>
</body>
</html>
