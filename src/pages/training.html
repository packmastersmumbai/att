<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Calendar — QR Att.</title>
  <style>
    /* Colours, spacing and type all come from the shared tokens injected by
       doGet(); only what is specific to this page is declared here. */
    :root{
      --done:#0f766e; --done-bg:#ccfbf1;
      --due:#b45309;  --due-bg:#fef3c7;
      --late:#b91c1c; --late-bg:#fee2e2;
      --plan:#3730a3; --plan-bg:#eef2ff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);
      font-size:13px;line-height:1.45;display:flex}

    /* ── Sidebar (matches reports/visitors) ── */
    .sb{width:238px;flex-shrink:0;background:var(--color-surface);
      border-right:1px solid var(--color-border);display:flex;flex-direction:column}
    .sb-logo{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--color-border)}
    .sb-logo-icon{width:32px;height:32px;border-radius:var(--radius-md);background:var(--color-primary);
      color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
    .sb-logo-name{font-weight:800;font-size:16px;color:var(--color-primary);line-height:1}
    .sb-logo-sub{font-size:9px;color:var(--color-text-muted);letter-spacing:1.4px;text-transform:uppercase}
    .sb-nav{padding:12px 10px;flex:1}
    .sb-section{font-size:9px;font-weight:700;color:var(--color-text-muted);letter-spacing:1.2px;
      text-transform:uppercase;padding:8px 8px 4px}
    .sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-md);
      color:var(--color-text);text-decoration:none;font-size:13px;font-weight:500}
    .sb-item:hover{background:#f5f0ee}
    .sb-item.active{background:var(--color-primary);color:#fff}
    .sb-icon{width:17px;height:17px;flex-shrink:0}

    /* ── Main ── */
    .main{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
    .doc{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md)}
    .doc-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
      padding:14px 16px;border-bottom:1px solid var(--color-border);flex-wrap:wrap}
    .doc-t{font-size:16px;font-weight:800}
    .doc-meta{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);margin-top:2px}
    .ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .seg{display:flex;border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
    .seg button{border:0;background:var(--color-surface);color:var(--color-text-muted);cursor:pointer;
      font:600 11px var(--font-sans);padding:7px 12px;min-height:34px}
    .seg button[aria-pressed="true"]{background:var(--color-primary);color:#fff}
    .btn{border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);
      border-radius:var(--radius-md);font:600 11px var(--font-sans);padding:7px 12px;
      min-height:34px;cursor:pointer}
    .btn-pri{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
    .btn:disabled{opacity:.5;cursor:default}

    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      border-bottom:1px solid var(--color-border)}
    .kpi{padding:10px 16px;border-right:1px solid var(--color-border)}
    .kpi:last-child{border-right:0}
    .kpi-l{font-size:10px;font-weight:700;color:var(--color-text-muted);
      text-transform:uppercase;letter-spacing:.6px}
    .kpi-v{font:800 20px/1.1 var(--font-mono);margin-top:3px;font-variant-numeric:tabular-nums}
    .kpi-v.warn{color:var(--color-warning)} .kpi-v.bad{color:var(--color-danger)}

    .scroll{overflow-x:auto}
    table{border-collapse:collapse;width:100%;font-size:12px}
    th,td{border:1px solid var(--color-border);padding:6px 8px;text-align:left}
    thead th{background:var(--color-bg);font-size:10px;font-weight:700;color:var(--color-text-muted);
      text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
    /* The topic column takes what it needs and the twelve months split the
       rest evenly, so an empty month is not the same width as one holding a
       date. table-layout:fixed keeps all twelve equal regardless of content —
       without it a single long topic title squeezes December to nothing. */
    table{table-layout:fixed}
    /* overflow-wrap matters because table-layout:fixed clips rather than
       widens — the longest real title is "Emergency Response, Fire
       Extinguisher, Hose". */
    .topic{width:auto;min-width:220px;font-weight:600;
      overflow-wrap:anywhere;white-space:normal}
    .topic .n{font-family:var(--font-mono);color:var(--color-muted);margin-right:6px}
    .mth{width:6.2%;min-width:50px;text-align:center;padding:4px}

    /* Status carries a glyph as well as a colour, so the grid survives a
       black-and-white print and is readable to a colour-blind auditor. */
    .cell{display:inline-flex;align-items:center;justify-content:center;gap:2px;
      font:700 11px var(--font-mono);padding:4px 6px;border-radius:var(--radius-md);
      min-width:42px;min-height:26px;cursor:pointer;border:1px solid transparent;
      font-variant-numeric:tabular-nums}
    .cell:hover{border-color:var(--color-primary)}
    /* The grid's only action is opening a session. As a <span onclick> it was
       unreachable by keyboard entirely — every cell is a button now. */
    .cell:focus-visible,.btn:focus-visible,.seg button:focus-visible,.inp:focus-visible{
      outline:2px solid var(--color-primary);outline-offset:2px}
    .c-done{background:var(--done-bg);color:var(--done)}
    .c-due {background:var(--due-bg); color:var(--due)}
    .c-late{background:var(--late-bg);color:var(--late)}
    .c-plan{background:var(--plan-bg);color:var(--plan)}
    .legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;font-size:11px;
      color:var(--color-text-muted);border-top:1px solid var(--color-border)}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .sw{width:12px;height:12px;border-radius:2px;display:inline-block;flex-shrink:0}
    .empty{padding:34px 16px;text-align:center;color:var(--color-text-muted);font-size:13px}
    .setup-note{padding:9px 16px;background:var(--done-bg);color:var(--done);
      font-size:12px;font-weight:600;border-bottom:1px solid var(--color-border)}

    /* ── Session panel ── */
    .backdrop{display:none;position:fixed;inset:0;background:rgba(2,6,16,.45);z-index:40}
    .backdrop.on{display:block}
    .panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;z-index:41;
      background:var(--color-surface);border-left:1px solid var(--color-border);
      transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column}
    .panel.on{transform:none}
    .panel-hd{padding:14px 16px;border-bottom:1px solid var(--color-border);
      display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .panel-b{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
    .fld{display:flex;flex-direction:column;gap:5px}
    /* Direct child only. Each attendee row is itself a <label> nested inside
       .fld, and a descendant selector rendered every worker's name in
       uppercase with field-label letter-spacing. */
    .fld > label{font-size:10px;font-weight:700;color:var(--color-text-muted);
      text-transform:uppercase;letter-spacing:.5px}
    .inp{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:8px 10px;
      font:400 13px var(--font-sans);background:var(--color-surface);color:var(--color-text);
      min-height:38px;width:100%}
    .inp:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(0,6,102,.10)}
    .agenda{background:var(--color-bg);border:1px solid var(--color-border);
      border-radius:var(--radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-muted)}
    .agenda b{display:block;color:var(--color-text);font-size:10px;text-transform:uppercase;
      letter-spacing:.5px;margin-bottom:5px}
    .agenda ul{margin:0 0 6px 16px}
    .agenda li{margin-bottom:2px}
    /* Attendee list. The score sits ON the row so a trainer makes one pass
       down the list instead of ticking here and scoring somewhere else. */
    .att{border:1px solid var(--color-border);border-radius:var(--radius-md);
      max-height:260px;overflow-y:auto}
    .att-r{display:flex;align-items:center;gap:9px;padding:7px 10px;
      border-bottom:1px solid var(--color-border)}
    .att-r:last-child{border-bottom:0}
    .att-r input[type=checkbox]{width:18px;height:18px;flex-shrink:0;
      accent-color:var(--color-primary);cursor:pointer}
    .att-n{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap}
    .att-d{font-size:10px;color:var(--color-muted);width:72px;flex-shrink:0}
    .score{width:52px;min-height:30px;text-align:center;font:600 12px var(--font-mono);
      padding:4px;border:1px solid var(--color-border);border-radius:var(--radius-md);
      background:var(--color-surface);color:var(--color-text)}
    .score:disabled{opacity:.35}
    .score.low{border-color:var(--color-warning);color:var(--color-warning)}
    .att-foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;
      color:var(--color-text-muted);padding:7px 10px;background:var(--color-bg);
      border-top:1px solid var(--color-border);flex-wrap:wrap}
    .rating{display:flex;gap:6px}
    .rating button{width:38px;min-height:36px;border:1px solid var(--color-border);
      border-radius:var(--radius-md);background:var(--color-surface);
      color:var(--color-text);font:700 12px var(--font-mono);cursor:pointer}
    .rating button[aria-pressed="true"]{background:var(--color-primary);
      border-color:var(--color-primary);color:#fff}
    .thumbs{display:flex;gap:6px;flex-wrap:wrap}
    .thumbs img{width:52px;height:52px;object-fit:cover;border-radius:var(--radius-md);
      border:1px solid var(--color-border)}

    /* Below 900px the sidebar becomes a horizontal strip. At 390px it was
       taking 238 of the screen's width and leaving the calendar about 150px —
       and a supervisor on the floor carries a phone, not a desktop. */
    @media (max-width:900px){
      body{flex-direction:column}
      .sb{width:100%;border-right:0;border-bottom:1px solid var(--color-border)}
      .sb-logo{padding:10px 14px}
      .sb-nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px}
      .sb-section{display:none}
      .sb-item{white-space:nowrap;padding:8px 12px}
      .main{padding:14px}
      .doc-hd{flex-direction:column;align-items:stretch}
      .panel{width:100%}
      /* Keep the topic name visible while the months scroll under it —
         a bare date is meaningless without knowing which topic it belongs to. */
      .topic{min-width:150px;position:sticky;left:0;background:var(--color-surface);z-index:1}
    }
    @media print{.sb,.ctrls,.panel,.backdrop{display:none!important}.main{padding:0}}
  </style>
</head>
<body>

    <div class="sb-logo">

      </a>

  </aside>

  <main class="main">
    <section class="doc">
      <div class="doc-hd">
        <div>
          <div class="doc-t">Annual Training Calendar <span id="hdYear">—</span></div>
          <div class="doc-meta">Format F-TR-01 · Rev 00 · <?= orgName ?></div>
        </div>
        <div class="ctrls">
          <div class="seg" id="yearSeg"></div>
          <div class="seg" id="typeSeg">
            <button type="button" data-type="TRAIN" aria-pressed="true">Training</button>
            <button type="button" data-type="DRILL" aria-pressed="false">Mock drill</button>
          </div>
          <button class="btn" onclick="window.print()">Print</button>
        </div>
      </div>

      <div id="setupNote" class="setup-note" style="display:none" role="status"></div>
      <div class="kpis" id="kpis"></div>
      <div class="scroll"><table id="grid"></table></div>

      <div class="legend">
        <span><i class="sw" style="background:var(--done-bg);border:1px solid var(--done)"></i> ✓ Completed</span>
        <span><i class="sw" style="background:var(--due-bg);border:1px solid var(--due)"></i> ◷ Due this month</span>
        <span><i class="sw" style="background:var(--late-bg);border:1px solid var(--late)"></i> ! Overdue</span>
        <span><i class="sw" style="background:var(--plan-bg);border:1px solid var(--plan)"></i> &middot; Planned</span>
        <span>Number is the day of the month. Click a cell to open the session.</span>
      </div>
    </section>
  </main>

  <div class="backdrop" id="backdrop" onclick="closePanel()"></div>
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-hd">
      <div>
        <div style="font-weight:700;font-size:15px" id="pTitle">—</div>
        <div class="doc-meta" id="pMeta">—</div>
      </div>
      <button class="btn" onclick="closePanel()" aria-label="Close">&times;</button>
    </div>
    <div class="panel-b">
      <div class="agenda" id="pAgenda"></div>
      <div class="fld"><label for="pActual">Actual date</label>
        <input type="date" class="inp" id="pActual"></div>
      <div class="fld"><label for="pTrainer">Trainer</label>
        <input type="text" class="inp" id="pTrainer" placeholder="Who delivered it"></div>
      <div class="fld">
        <label>Attendees &amp; assessment</label>
        <div class="att" id="pAtt"></div>
        <div class="att-foot">
          <span id="pAttCount">—</span>
          <span>
            <button type="button" class="btn" onclick="attAll(true)">Select all</button>
            <button type="button" class="btn" onclick="attAll(false)">Clear</button>
          </span>
        </div>
      </div>

      <div class="fld"><label for="pObs">Observations</label>
        <textarea class="inp" id="pObs" rows="3" placeholder="How it went"></textarea></div>

      <div class="fld"><label>Photos</label>
        <div class="thumbs" id="pThumbs"></div>
        <input type="file" id="pPhotoFile" accept="image/*" capture="environment"
               style="display:none" onchange="uploadPhoto(this)">
        <button type="button" class="btn" onclick="document.getElementById('pPhotoFile').click()">
          Add photo</button></div>

      <div class="fld"><label>Session rating</label>
        <div class="rating" id="pRating" role="group" aria-label="Session rating out of 5"></div></div>

      <button class="btn btn-pri" id="pSave" onclick="saveSession()" style="min-height:42px">Save session</button>
      <div id="pMsg" style="font-size:12px;color:var(--color-text-muted)"></div>
    </div>
  </aside>

  <script>
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var DATA = { topics: [], plan: [], years: [], year: '' };
    var VIEW = 'TRAIN';
    var OPEN = null;

    function esc(s){ return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function post(payload, ok, fail) {
      google.script.run.withSuccessHandler(ok)
        .withFailureHandler(fail || function(e){ msg('Error: ' + (e && e.message)); })[payload.fn]
        .apply(null, payload.args);
    }

    function msg(t){ document.getElementById('pMsg').textContent = t || ''; }

    function load(year) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) return;
          DATA = res;
          document.getElementById('hdYear').textContent = res.year;
          renderYears();
          render();
        })
        .withFailureHandler(function (e) {
          document.getElementById('grid').innerHTML =
            '<tr><td class="empty">Could not load the calendar: ' + esc(e && e.message) + '</td></tr>';
        })
        .getTrainingCalendar(year || '');
    }

    function renderYears() {
      document.getElementById('yearSeg').innerHTML = (DATA.years || []).map(function (y) {
        return '<button type="button" onclick="load(\'' + y + '\')" aria-pressed="' +
               (String(y) === String(DATA.year)) + '">' + esc(y) + '</button>';
      }).join('');
    }

    /* One row per topic, one column per month. The cell shows the day number
       of whichever session falls in that month. */
    function render() {
      var topics = DATA.topics.filter(function (t) { return (t.Type || 'TRAIN') === VIEW; });
      var byTopic = {};
      DATA.plan.forEach(function (p) {
        if ((p.type || 'TRAIN') !== VIEW) return;
        (byTopic[p.topicId] = byTopic[p.topicId] || []).push(p);
      });

      var head = '<thead><tr><th class="topic">' +
        (VIEW === 'DRILL' ? 'Mock drill scenario' : 'Training topic') + '</th>' +
        MONTHS.map(function (m) { return '<th class="mth">' + m + '</th>'; }).join('') +
        '</tr></thead>';

      if (!topics.length) {
        // An empty state that sends the user somewhere else is a dead end.
        // The action that fills the page belongs on the page.
        document.getElementById('grid').innerHTML = head +
          '<tbody><tr><td class="empty" colspan="13">' +
            '<div style="font-weight:700;color:var(--color-text);margin-bottom:4px">' +
              'Nothing scheduled for ' + esc(DATA.year) + '</div>' +
            '<div style="margin-bottom:14px">Load the ten topics with their agendas, ' +
              'the 2025 calendar from the training records, plans for this year and next ' +
              'derived from it, and the skill library.</div>' +
            '<button type="button" class="btn btn-pri" onclick="seedYear()">' +
              'Set up training</button>' +
            '<div id="seedMsg" style="margin-top:10px"></div>' +
          '</td></tr></tbody>';
        renderKpis([]);
        return;
      }

      var body = topics.map(function (t, i) {
        var cells = new Array(12).fill('');
        (byTopic[t.TopicID] || []).forEach(function (p) {
          var shown = p.actualDate || p.plannedDate;
          if (!shown) return;
          var mi = Number(shown.slice(5, 7)) - 1;
          var day = shown.slice(8, 10);
          var cls = { DONE: 'c-done', DUE: 'c-due', OVERDUE: 'c-late', PLANNED: 'c-plan' }[p.status];
          // Every state carries a glyph, not just a hue: printed in black and
          // white, "planned" and "no session" were the same pale cell.
          var mark = { DONE: '✓', DUE: '◷', OVERDUE: '!', PLANNED: '·' }[p.status];
          var label = esc(t.Title) + ', ' + p.status.toLowerCase() + ' ' + shown;
          cells[mi] = '<button type="button" class="cell ' + cls + '" ' +
                      'onclick="openPanel(\'' + p.planId + '\')" ' +
                      'title="' + label + '" aria-label="' + label + '">' +
                      mark + day + '</button>';
        });
        return '<tr><td class="topic"><span class="n">' + (i + 1) + '</span>' + esc(t.Title) + '</td>' +
               cells.map(function (c) { return '<td class="mth">' + c + '</td>'; }).join('') + '</tr>';
      }).join('');

      document.getElementById('grid').innerHTML = head + '<tbody>' + body + '</tbody>';
      renderKpis(DATA.plan.filter(function (p) { return (p.type || 'TRAIN') === VIEW; }));
    }

    function renderKpis(rows) {
      var done = rows.filter(function (r) { return r.status === 'DONE'; }).length;
      var overdue = rows.filter(function (r) { return r.status === 'OVERDUE'; }).length;

      // Adherence measures sessions that SHOULD have happened by now — done
      // plus overdue. Dividing by the whole year's plan made a perfectly
      // on-schedule January read 8%, which reads as failure to anyone
      // glancing at it.
      var dueSoFar = done + overdue;
      var pct = dueSoFar ? Math.round(done / dueSoFar * 100) : 100;
      var hrs = 0;
      var byId = {};
      DATA.topics.forEach(function (t) { byId[t.TopicID] = t; });
      rows.forEach(function (r) {
        if (r.status === 'DONE') hrs += Number((byId[r.topicId] || {}).DurationHrs || 0);
      });

      document.getElementById('kpis').innerHTML = [
        ['On-time so far', pct + '%', pct < 80 ? 'warn' : ''],
        ['Sessions held', done + '/' + rows.length, ''],
        ['Overdue', String(overdue), overdue ? 'bad' : ''],
        ['Hours delivered', hrs.toFixed(1), '']
      ].map(function (k) {
        return '<div class="kpi"><div class="kpi-l">' + k[0] + '</div>' +
               '<div class="kpi-v ' + k[2] + '">' + k[1] + '</div></div>';
      }).join('');
    }

    document.getElementById('typeSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-type]');
      if (!b) return;
      VIEW = b.dataset.type;
      [].forEach.call(this.querySelectorAll('button'), function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      render();
    });

    function openPanel(planId) {
      var p = DATA.plan.filter(function (x) { return x.planId === planId; })[0];
      if (!p) return;
      var t = DATA.topics.filter(function (x) { return x.TopicID === p.topicId; })[0] || {};
      OPEN = p;

      document.getElementById('pTitle').textContent = t.Title || p.topicId;
      document.getElementById('pMeta').textContent =
        'Planned ' + (p.plannedDate || '—') + ' · ' + (t.DurationHrs || '?') + ' hrs';
      document.getElementById('pAgenda').innerHTML =
        '<b>Agenda — from the topic library</b><ul>' +
        String(t.Agenda || '').split('|').filter(Boolean)
          .map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') +
        '</ul>' + (t.Method ? 'Method: ' + esc(t.Method) : '');
      document.getElementById('pActual').value = p.actualDate || '';
      document.getElementById('pTrainer').value = p.trainer || '';
      document.getElementById('pObs').value = '';
      setRating(p.rating || '');
      msg('');

      // The roster is fetched per session rather than held page-wide: it must
      // reflect who is on the payroll now AND who was already marked present.
      ROSTER = [];
      document.getElementById('pAtt').innerHTML =
        '<div style="padding:14px;color:var(--color-text-muted)">Loading the roster...</div>';
      document.getElementById('pThumbs').innerHTML = '';
      google.script.run
        .withSuccessHandler(function (a) {
          if (!a || !a.success) {
            document.getElementById('pAtt').innerHTML =
              '<div style="padding:14px;color:var(--color-danger)">Could not load the roster.</div>';
            return;
          }
          ROSTER = a.roster || [];
          PASS_MARK = a.passMark || 70;
          if (a.session) {
            document.getElementById('pObs').value = a.session.observations || '';
            renderThumbs(a.session.photoURLs || []);
          }
          renderRoster();
        })
        .withFailureHandler(function (e) {
          document.getElementById('pAtt').innerHTML =
            '<div style="padding:14px;color:var(--color-danger)">' + esc(e && e.message) + '</div>';
        })
        .getSessionAttendance(p.planId);

      document.getElementById('panel').classList.add('on');
      document.getElementById('panel').setAttribute('aria-hidden', 'false');
      document.getElementById('backdrop').classList.add('on');
    }

    function closePanel() {
      document.getElementById('panel').classList.remove('on');
      document.getElementById('panel').setAttribute('aria-hidden', 'true');
      document.getElementById('backdrop').classList.remove('on');
      OPEN = null;
    }

    /* -- Attendance -- */
    var ROSTER = [], PASS_MARK = 70, RATING = '';

    function renderRoster() {
      if (!ROSTER.length) {
        document.getElementById('pAtt').innerHTML =
          '<div style="padding:14px;color:var(--color-text-muted)">No active employees.</div>';
        attCount();
        return;
      }
      document.getElementById('pAtt').innerHTML = ROSTER.map(function (r, i) {
        return '<label class="att-r">' +
          '<input type="checkbox" data-i="' + i + '"' + (r.present ? ' checked' : '') +
            ' onchange="attToggle(this)" aria-label="' + esc(r.name) + ' attended">' +
          '<span class="att-n">' + esc(r.name) + '</span>' +
          '<span class="att-d">' + esc(r.dept) + '</span>' +
          '<input class="score" type="number" min="0" max="100" data-i="' + i + '"' +
            ' value="' + esc(r.score) + '"' + (r.present ? '' : ' disabled') +
            ' oninput="attScore(this)" placeholder="-"' +
            ' aria-label="Score for ' + esc(r.name) + '"></label>';
      }).join('');
      [].forEach.call(document.querySelectorAll('#pAtt .score'), markLow);
      attCount();
    }

    function markLow(el) {
      var v = el.value.trim();
      el.classList.toggle('low', v !== '' && Number(v) < PASS_MARK);
    }

    function attToggle(cb) {
      var r = ROSTER[Number(cb.dataset.i)];
      r.present = cb.checked;
      // A score against someone who was not there is meaningless, so the box
      // follows the tick rather than sitting there inviting one.
      var sc = cb.closest('.att-r').querySelector('.score');
      sc.disabled = !cb.checked;
      if (!cb.checked) { sc.value = ''; r.score = ''; markLow(sc); }
      attCount();
    }

    function attScore(el) {
      ROSTER[Number(el.dataset.i)].score = el.value.trim();
      markLow(el);
      attCount();
    }

    function attAll(on) {
      ROSTER.forEach(function (r) { r.present = on; if (!on) r.score = ''; });
      renderRoster();
    }

    function attCount() {
      var present = ROSTER.filter(function (r) { return r.present; });
      var scored = present.filter(function (r) { return r.score !== '' && r.score != null; });
      var below = scored.filter(function (r) { return Number(r.score) < PASS_MARK; }).length;
      document.getElementById('pAttCount').textContent =
        present.length + ' of ' + ROSTER.length + ' present' +
        (scored.length ? ' \u00b7 ' + scored.length + ' scored \u00b7 pass mark ' + PASS_MARK : '') +
        (below ? ' \u00b7 ' + below + ' below' : '');
    }

    function setRating(v) {
      RATING = String(v || '');
      document.getElementById('pRating').innerHTML = [1, 2, 3, 4, 5].map(function (n) {
        return '<button type="button" onclick="setRating(' + n + ')" ' +
               'aria-pressed="' + (String(n) === RATING) + '">' + n + '</button>';
      }).join('');
    }

    function renderThumbs(urls) {
      document.getElementById('pThumbs').innerHTML = (urls || []).map(function (u) {
        return '<img src="' + esc(u) + '" alt="Session photo">';
      }).join('');
    }

    function uploadPhoto(input) {
      var f = input.files && input.files[0];
      if (!f || !OPEN) return;
      msg('Uploading photo...');
      var reader = new FileReader();
      reader.onload = function () {
        google.script.run
          .withSuccessHandler(function (r) {
            input.value = '';
            if (!r || !r.success) { msg((r && r.error) || 'Photo upload failed'); return; }
            msg(r.count + ' photo(s) attached.');
            document.getElementById('pThumbs').innerHTML +=
              '<img src="' + esc(r.url) + '" alt="Session photo">';
          })
          .withFailureHandler(function (e) { input.value = ''; msg('Error: ' + (e && e.message)); })
          .addSessionPhoto(OPEN.planId, reader.result);
      };
      reader.readAsDataURL(f);
    }

    function saveSession() {
      if (!OPEN) return;
      var btn = document.getElementById('pSave');
      btn.disabled = true; msg('Saving…');

      // Two writes: the session row, then its attendance. Attendance goes
      // second so a failure there cannot leave a session marked as held with
      // nobody in it, which is the more misleading of the two half-states.
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r || !r.success) { btn.disabled = false; msg((r && r.error) || 'Could not save'); return; }
          google.script.run
            .withSuccessHandler(function (a) {
              btn.disabled = false;
              if (!a || !a.success) { msg((a && a.error) || 'Session saved, attendance did not'); return; }
              msg(a.present + ' marked present.');
              closePanel();
              load(DATA.year);
            })
            .withFailureHandler(function (e) { btn.disabled = false; msg('Attendance error: ' + (e && e.message)); })
            .saveSessionAttendance(OPEN.planId, ROSTER.map(function (x) {
              return { empId: x.empId, name: x.name, present: x.present, score: x.score };
            }));
        })
        .withFailureHandler(function (e) { btn.disabled = false; msg('Error: ' + (e && e.message)); })
        .saveTrainingSession({
          planId: OPEN.planId,
          actualDate: document.getElementById('pActual').value,
          trainer: document.getElementById('pTrainer').value.trim(),
          observations: document.getElementById('pObs').value.trim(),
          rating: RATING
        });
    }

    /* Seeding writes the whole year's plan, so it is admin-gated on the server.
       This page has no PIN screen of its own — asking for the PIN at the moment
       it is needed is less machinery than a second gate, and this runs once. */
    /* A note that outlives the grid repaint. It also links onward to the
       matrix, because seeding is the moment the second half of the module
       becomes worth visiting. */
    function setupNote(text) {
      var el = document.getElementById('setupNote');
      el.innerHTML = esc(text) +
        ' <a href="?page=skillmatrix" style="color:inherit">Open the skill matrix →</a>';
      el.style.display = '';
    }

    /* Brings the whole module up in one action — topics, the 2025 history,
       the derived plans for this year and next, and the skill library. Each
       part is idempotent, and running them separately in the wrong order is
       how a module ends up half seeded, which reads exactly like a bug. */
    function seedYear() {
      var box = document.getElementById('seedMsg');
      var pin = window.prompt('Admin PIN to set up training');
      if (!pin) return;
      box.textContent = 'Checking…';

      google.script.run
        .withSuccessHandler(function (v) {
          if (!v || !v.success || !v.token) { box.textContent = 'That PIN was not accepted.'; return; }
          box.textContent = 'Setting up…';
          google.script.run
            .withSuccessHandler(function (r) {
              if (!r || !r.success) { box.textContent = (r && r.error) || 'Could not set up training.'; return; }
              var years = (r.years || []).map(function (y) { return y.year; }).join(', ');
              // Reported OUTSIDE the empty state: load() repaints the grid with
              // the seeded topics, which destroys #seedMsg along with it. Put
              // the result there and the supervisor never learns the skill
              // library came up too.
              setupNote(r.sessionsAdded + ' sessions across ' + years +
                        ', and ' + r.skillsAdded + ' skills.');
              load(DATA.year);
            })
            .withFailureHandler(function (e) { box.textContent = 'Error: ' + (e && e.message); })
            .setupTraining(v.token, null);
        })
        .withFailureHandler(function (e) { box.textContent = 'Error: ' + (e && e.message); })
        .verifyPIN(pin);
    }

    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });
    load('');
  </script>
</body>
</html>
