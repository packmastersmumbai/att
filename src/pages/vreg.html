<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Visitor Self Registration</title>
  <style>
    :root{
      --primary:#006b5f; --primary-dk:#005549; --danger:#dc2626;
      --bg:#f1f5f4; --surface:#ffffff; --text:#0f172a; --muted:#64748b; --border:#d7e0de;
      --radius:12px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--text);
      min-height:100vh;padding:16px;line-height:1.4}
    .wrap{max-width:440px;margin:0 auto}
    .head{display:flex;align-items:center;gap:10px;margin:6px 2px 16px}
    .head .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#0ea5a0,#006b5f);
      color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
    .head .t1{font-size:16px;font-weight:800}
    .head .t2{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .sec{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
      letter-spacing:1.2px;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
    .sec:first-of-type{margin-top:0}
    .fg{margin-bottom:10px}
    label{display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:4px}
    label .req{color:var(--danger)}
    .input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
      font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;-webkit-appearance:none}
    .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,107,95,.10)}
    .row{display:flex;gap:10px}
    .row .fg{flex:1}
    .btn{width:100%;margin-top:14px;padding:14px;background:var(--primary);color:#fff;border:none;
      border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s}
    .btn:hover{background:var(--primary-dk)}
    .btn:disabled{opacity:.6;cursor:default}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
      background:#0f172a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
      opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
    .toast.show{opacity:1}
    .toast.error{background:var(--danger)}
    .photo{display:flex;flex-direction:column;align-items:center;justify-content:center;
      border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;margin-bottom:12px}
    .photo img{max-height:120px;border-radius:8px;display:none}
    .photo .ic{font-size:26px}
    .photo .l{font-size:12px;font-weight:600;color:#334155;margin-top:4px}
    .photo .s{font-size:10px;color:var(--muted)}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{padding:9px 14px;border:1px solid var(--border);border-radius:20px;background:#fff;
      font-size:13px;font-weight:600;color:#334155;cursor:pointer;user-select:none;transition:all .12s}
    .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
    .more-toggle{margin-top:14px;font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;user-select:none;padding:4px 0}
    .more-toggle #moreArrow{display:inline-block;transition:transform .15s}
    .more-toggle.open #moreArrow{transform:rotate(90deg)}
    .safety{margin-top:16px;border:1px solid #fcd34d;background:#fffbeb;border-radius:10px;padding:12px}
    .safety-hd{font-size:13px;font-weight:800;color:#92400e;margin-bottom:9px}
    .safety-video{position:relative;width:100%;aspect-ratio:16/9;background:#0f172a;border-radius:8px;overflow:hidden;margin-bottom:10px}
    .safety-video iframe,.safety-video video{position:absolute;inset:0;width:100%;height:100%;border:0}
    .safety-video .novid{display:flex;align-items:center;justify-content:center;height:100%;color:#64748b;font-size:12px;text-align:center;padding:12px}
    .safety-ack{display:flex;gap:9px;align-items:flex-start;font-size:12px;font-weight:600;color:#78350f;cursor:pointer;line-height:1.5}
    .safety-ack input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:#b45309}
    .safety-ack input:disabled{opacity:.4}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .rules-hint{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;
      color:#92400e;margin:2px 0 8px}
    .rules-count{background:#fde68a;color:#78350f;padding:2px 8px;border-radius:10px;font-size:11px}
    .rules-count.done{background:#16a34a;color:#fff}
    .rule{position:relative;background:#fff;border:1px solid #fde68a;border-radius:8px;padding:10px 11px;
      margin-bottom:7px;cursor:pointer;overflow:hidden}
    .rule .rtxt{font-size:12px;line-height:1.55;color:#1f2937;transition:filter .35s ease}
    .rule .rtxt .en{color:#64748b;display:block;margin-top:2px}
    .rule .rnum{font-weight:800;color:#b45309;margin-right:5px}
    .rule.blurred .rtxt{filter:blur(4.5px);user-select:none}
    .rule .tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:800;color:#92400e;background:rgba(255,251,235,.35)}
    .rule.revealed{border-color:#86efac;background:#f0fdf4;cursor:default}
    .rule.revealed .tap{display:none}
    .rule.revealed:after{content:'✓';position:absolute;top:8px;right:10px;color:#16a34a;font-weight:800;font-size:13px}
    .lang-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">QR</div>
      <div>
        <div class="t1"><?= orgName ?></div>
        <div class="t2">Visitor Self Registration</div>
      </div>
      <div class="lang-toggle" id="langToggle" style="margin-left:auto;display:flex;gap:6px">
        <button type="button" class="lang-btn" data-lang-btn="en" onclick="qrattSetLang('en')" style="min-height:32px;padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:11px;font-weight:700;cursor:pointer">EN</button>
        <button type="button" class="lang-btn" data-lang-btn="hi" onclick="qrattSetLang('hi')" style="min-height:32px;padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:11px;font-weight:700;cursor:pointer">हिं</button>
      </div>
    </div>

    <!-- Fast path for frequent visitors: just enter phone, skip the form -->
    <div class="card" id="returnCard" style="margin-bottom:12px">
      <label data-i18n="vreg_been_here" style="display:block;font-size:13px;font-weight:700;margin-bottom:6px">Been here before?</label>
      <div class="row" style="align-items:stretch">
        <input type="tel" id="rPhone" class="input" data-i18n-ph="vreg_mobile_ph" placeholder="Mobile number" style="flex:1" autocomplete="tel">
        <button class="btn" id="rBtn" data-i18n="vreg_find" style="width:auto;margin:0;padding:0 18px;white-space:nowrap" onclick="lookupReturning()">Find</button>
      </div>
      <div data-i18n="vreg_new_visitor_hint" style="font-size:11px;color:var(--muted);margin-top:6px">New visitor? Fill the form below.</div>
    </div>

    <div class="card" id="formCard">
      <div class="fg">
        <label><span data-i18n="vreg_name">Name</span> <span class="req">*</span></label>
        <input type="text" id="vName" class="input" data-i18n-ph="vreg_name_ph" placeholder="Rahul Sharma" autocomplete="name">
      </div>
      <div class="fg">
        <label><span data-i18n="vreg_mobile">Mobile</span> <span class="req">*</span></label>
        <input type="tel" id="vPhone" class="input" placeholder="98765 43210" autocomplete="tel">
      </div>

      <div class="fg">
        <label><span data-i18n="vreg_whom">Whom to meet</span> <span class="req">*</span></label>
        <select id="vHost" class="input">
          <option value="" data-i18n="vreg_loading">Loading…</option>
        </select>
      </div>

      <div class="fg">
        <label data-i18n="vreg_purpose">Purpose</label>
        <div class="chips" id="purposeChips"></div>
        <input type="hidden" id="vPurpose" value="">
      </div>

      <div class="photo" id="photoBox" onclick="document.getElementById('vPhotoFile').click()">
        <img id="vPhotoPreview" alt="">
        <div class="ic" id="photoIc">📷</div>
        <div class="l" id="photoLbl" data-i18n="vreg_add_photo">Add Photo (optional)</div>
        <div class="s" data-i18n="vreg_tap_camera">Tap to use camera</div>
      </div>
      <input type="file" id="vPhotoFile" accept="image/*" capture="user" style="display:none" onchange="previewPhoto(this)">

      <!-- Optional details — collapsed by default for fast entry -->
      <div class="more-toggle" id="moreToggle" onclick="toggleMore()">
        <span id="moreArrow">▸</span> <span data-i18n="vreg_more_details">More details</span>
      </div>
      <div id="moreFields" style="display:none">
        <div class="row">
          <div class="fg">
            <label data-i18n="vreg_type">Type</label>
            <select id="vType" class="input">
              <option>Guest</option><option>Courier</option><option>Supplier</option>
              <option>Contractor</option><option>Other</option>
            </select>
          </div>
          <div class="fg">
            <label data-i18n="vreg_company">Company</label>
            <input type="text" id="vCompany" class="input" placeholder="Company">
          </div>
        </div>
        <div class="row">
          <div class="fg" style="flex:0 0 42%">
            <label data-i18n="vreg_id_type">ID Type</label>
            <select id="vIDType" class="input">
              <option value="">—</option>
              <option>Aadhaar</option><option>Passport</option><option>PAN Card</option>
              <option>Driving Licence</option><option>Voter ID</option><option>Other</option>
            </select>
          </div>
          <div class="fg">
            <label data-i18n="vreg_id_number">ID Number</label>
            <input type="text" id="vIDNumber" class="input" data-i18n-ph="vreg_id_number_ph" placeholder="Last 4 digits">
          </div>
        </div>
        <div class="fg">
          <label data-i18n="vreg_vehicle">Vehicle Number</label>
          <input type="text" id="vVehicle" class="input" placeholder="MH-01-AB-1234">
        </div>
      </div>

      <!-- Safety induction — video + every rule must be revealed, then acknowledged -->
      <div class="safety" id="safetyBox">
        <div class="safety-hd">🦺 <span data-i18n="vreg_safety_title">Safety Instructions</span> <span class="req">*</span></div>
        <div id="safetyVideoWrap" class="safety-video"></div>

        <div class="rules-hint">
          <span data-i18n="vreg_tap_each_rule">Tap each rule to reveal</span>
          <span class="rules-count" id="rulesCount">0 / 0</span>
        </div>
        <div id="rulesList"></div>

        <label class="safety-ack" id="ackLabel">
          <input type="checkbox" id="vSafetyAck" onchange="onSafetyAck()" disabled>
          <span data-i18n="vreg_safety_ack">I have read and understood all the rules.</span>
        </label>
      </div>

      <button class="btn" id="regBtn" data-i18n="vreg_register_btn" onclick="submitReg()" style="display:none">Register &amp; Get Pass</button>
    </div>

    <!-- Confirmation shown after submit (replaces the form) -->
    <div class="card" id="doneCard" style="display:none;text-align:center">
      <div style="font-size:40px;line-height:1;margin:6px 0 4px">✅</div>
      <div id="doneTitle" data-i18n="vreg_done_title" style="font-size:17px;font-weight:800">You're registered</div>
      <div id="doneSub" data-i18n="vreg_done_subline" style="font-size:13px;color:var(--muted);margin-top:4px">Show this QR at the security desk to check in / out.</div>
      <img id="doneQR" alt="Visitor QR" style="width:200px;height:200px;margin:16px auto 8px;border-radius:10px;background:#f1f5f4;display:block">
      <div id="doneVid" style="font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px"></div>
      <a id="doneLink" href="#" data-i18n="vreg_open_pass" style="display:inline-block;margin-top:10px;font-size:13px;color:var(--primary);font-weight:700">Open my pass ↗</a>
      <button class="btn" style="margin-top:16px" data-i18n="vreg_close" onclick="closeReg()">Close</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var APP_URL = '<?= appUrl ?>';
    var PUBLIC_URL = '<?= publicUrl ?>';   // pretty base for the shareable pass link
    var HOST_DEPTS = '<?= hostDepartments ?>';   // comma-separated depts for "Whom to meet"; blank = all active

    function toast(msg, type){
      var t=document.getElementById('toast');
      t.textContent=msg; t.className='toast show'+(type==='error'?' error':'');
      setTimeout(function(){t.className='toast';},2600);
    }

    var vPhotoData='';   // captured photo (timestamped, downscaled) as base64 data URL

    /* Burn the capture date/time into the photo. The native camera can't draw an
       overlay, so we redraw it on a canvas: downscale (phone photos are huge as
       base64), then stamp "DD Mon YYYY HH:MM" bottom-right on a dark strip. */
    function _stampPhoto_(dataUrl, cb){
      var img=new Image();
      img.onload=function(){
        var MAXW=900;
        var scale=Math.min(1, MAXW/img.width);
        var w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        var ctx=cv.getContext('2d');
        ctx.drawImage(img,0,0,w,h);

        var now=new Date();
        var pad=function(n){return n<10?'0'+n:''+n;};
        var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var stamp=pad(now.getDate())+' '+MON[now.getMonth()]+' '+now.getFullYear()+
                  '  '+pad(now.getHours())+':'+pad(now.getMinutes());

        var fs=Math.max(13, Math.round(w*0.032));
        ctx.font='700 '+fs+'px -apple-system,Segoe UI,Roboto,sans-serif';
        var tw=ctx.measureText(stamp).width;
        var padX=Math.round(fs*0.6), padY=Math.round(fs*0.45);
        var bw=tw+padX*2, bh=fs+padY*2;
        ctx.fillStyle='rgba(0,0,0,.62)';
        ctx.fillRect(w-bw-8, h-bh-8, bw, bh);
        ctx.fillStyle='#fff';
        ctx.textBaseline='top';
        ctx.fillText(stamp, w-bw-8+padX, h-bh-8+padY);

        cb(cv.toDataURL('image/jpeg', 0.82));
      };
      img.onerror=function(){ cb(dataUrl); };   // fall back to the raw photo
      img.src=dataUrl;
    }

    function previewPhoto(input){
      if(!input.files || !input.files[0]) return;
      var reader=new FileReader();
      reader.onload=function(e){
        _stampPhoto_(e.target.result, function(stamped){
          vPhotoData=stamped;
          var prev=document.getElementById('vPhotoPreview');
          prev.src=stamped; prev.style.display='block';
          document.getElementById('photoIc').style.display='none';
          var lbl=document.getElementById('photoLbl');
          lbl.removeAttribute('data-i18n');   // no longer the "add photo" prompt
          lbl.textContent=qrattT('vreg_photo_added');
        });
      };
      reader.readAsDataURL(input.files[0]);
    }

    // Purpose chips — one tap to select (i18n label, English value stored)
    var PURPOSES=[
      {v:'Meeting',    key:'vreg_purpose_meeting'},
      {v:'Delivery',   key:'vreg_purpose_delivery'},
      {v:'Interview',  key:'vreg_purpose_interview'},
      {v:'Maintenance',key:'vreg_purpose_maintenance'},
      {v:'Other',      key:'vreg_purpose_other'}
    ];
    (function renderChips(){
      var box=document.getElementById('purposeChips');
      // Each chip carries data-i18n so qrattApplyLang() keeps its label in
      // sync on every language switch, same as any other translated node.
      box.innerHTML=PURPOSES.map(function(p){
        return '<span class="chip" data-v="'+p.v+'" data-i18n="'+p.key+'" onclick="pickPurpose(this)">'+qrattT(p.key)+'</span>';
      }).join('');
    })();
    function pickPurpose(el){
      document.querySelectorAll('#purposeChips .chip').forEach(function(c){c.classList.remove('on');});
      el.classList.add('on');
      document.getElementById('vPurpose').value=el.getAttribute('data-v');
    }

    function toggleMore(){
      var f=document.getElementById('moreFields'), t=document.getElementById('moreToggle');
      var open=f.style.display==='none';
      f.style.display=open?'block':'none';
      t.classList.toggle('open',open);
    }

    /* ── Safety induction video ──────────────────────────────
       URL comes from Config key 'SafetyVideoURL' so it can be swapped without a
       deploy. Register stays disabled until the visitor ticks the acknowledgement. */
    var SAFETY_DEFAULT='https://youtu.be/TJv6eO_L9LQ';
    var vSafetyAckAt='';

    function _ytId_(url){
      var m=String(url||'').match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{6,})/);
      return m?m[1]:'';
    }
    function renderSafetyVideo(url){
      var wrap=document.getElementById('safetyVideoWrap');
      var id=_ytId_(url||SAFETY_DEFAULT);
      if(id){
        wrap.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+
          '?rel=0&playsinline=1" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen></iframe>';
      } else if(url){
        var v=document.createElement('video');
        v.src=url; v.controls=true; v.playsInline=true;
        wrap.innerHTML=''; wrap.appendChild(v);
      } else {
        wrap.innerHTML='<div class="novid" data-i18n="vreg_video_unavailable">'+qrattT('vreg_video_unavailable')+'</div>';
      }
    }
    /* Safety rules. Each starts blurred; the visitor must tap every one to reveal
       it. Only when all are revealed does the acknowledgement checkbox unlock, and
       only when that is ticked does the Register button appear. Keys match the
       shared safety_rule_N dictionary entries (identical text also used on vpass). */
    var SAFETY_RULE_KEYS=['safety_rule_1','safety_rule_2','safety_rule_3','safety_rule_4',
                           'safety_rule_5','safety_rule_6','safety_rule_7'];
    var rulesRevealed=0;

    function renderRules(){
      var list=document.getElementById('rulesList');
      list.innerHTML=SAFETY_RULE_KEYS.map(function(key,i){
        return '<div class="rule blurred" data-i="'+i+'" onclick="revealRule(this)">'+
                 '<div class="rtxt"><span class="rnum">'+(i+1)+'.</span>'+
                   '<span data-i18n="'+key+'">'+qrattT(key)+'</span></div>'+
                 '<div class="tap">👆 <span data-i18n="vreg_tap_to_read">'+qrattT('vreg_tap_to_read')+'</span></div>'+
               '</div>';
      }).join('');
      updateRulesCount();
    }
    function revealRule(el){
      if(!el.classList.contains('blurred')) return;
      el.classList.remove('blurred');
      el.classList.add('revealed');
      rulesRevealed++;
      updateRulesCount();
    }
    function updateRulesCount(){
      var n=SAFETY_RULE_KEYS.length;
      var c=document.getElementById('rulesCount');
      c.textContent=rulesRevealed+' / '+n;
      var all=rulesRevealed>=n;
      c.classList.toggle('done',all);
      var cb=document.getElementById('vSafetyAck');
      cb.disabled=!all;                       // can't acknowledge until every rule is read
      if(!all){ cb.checked=false; onSafetyAck(); }
    }
    function onSafetyAck(){
      var ok=document.getElementById('vSafetyAck').checked && rulesRevealed>=SAFETY_RULE_KEYS.length;
      vSafetyAckAt = ok ? new Date().toISOString() : '';
      document.getElementById('regBtn').style.display = ok ? 'block' : 'none';
    }

    /* Pull the configured video URL + rules (fall back to the built-in defaults) */
    (function loadSafetyConfig(){
      renderRules();
      if(typeof google==='undefined' || !google.script){ renderSafetyVideo(SAFETY_DEFAULT); return; }
      google.script.run
        .withSuccessHandler(function(res){
          var url=SAFETY_DEFAULT;
          ((res&&res.data)||[]).forEach(function(c){ if(String(c.Key)==='SafetyVideoURL' && c.Value) url=String(c.Value); });
          renderSafetyVideo(url);
        })
        .withFailureHandler(function(){ renderSafetyVideo(SAFETY_DEFAULT); })
        .getConfig();
    })();

    // Populate the "Whom to meet" dropdown. Which departments are selectable as
    // hosts is Config-driven (HostDepartments, comma-separated). Each configured
    // department becomes its own optgroup, in the configured order. If the config
    // is blank, every active employee is shown in one group — so a new site works
    // without any department setup.
    function loadHosts(){
      var sel=document.getElementById('vHost');
      if(typeof google==='undefined' || !google.script){ sel.innerHTML='<option value="">—</option>'; return; }
      google.script.run
        .withSuccessHandler(function(res){
          var emps=(res&&res.data)||res||[];
          var active=emps.filter(function(e){ return String(e.Status||'ACTIVE').toUpperCase()==='ACTIVE'; });
          function opt(e){ return '<option value="'+e.EmpID+'">'+(e.Name||e.EmpID)+'</option>'; }
          function byName(a,b){ return String(a.Name||'').localeCompare(String(b.Name||'')); }
          function optsForDept(deptMatch){
            return active.filter(function(e){ return String(e.Department||'').toLowerCase()===deptMatch; })
              .sort(byName).map(opt).join('');
          }
          var depts=String(HOST_DEPTS||'').split(',').map(function(d){return d.trim();}).filter(Boolean);
          var html='<option value="">'+qrattT('vreg_select_person')+'</option>';
          if(!depts.length){
            // No config → every active employee, flat.
            var all=active.slice().sort(byName).map(opt).join('');
            sel.innerHTML = all ? html+all : '<option value="">—</option>';
            return;
          }
          var body='';
          depts.forEach(function(d){
            var opts=optsForDept(d.toLowerCase());
            if(opts) body+='<optgroup label="'+d+'">'+opts+'</optgroup>';
          });
          sel.innerHTML = body ? html+body : '<option value="">—</option>';
        })
        .withFailureHandler(function(){ sel.innerHTML='<option value="">—</option>'; })
        .getEmployees();
    }
    loadHosts();

    function submitReg(){
      var v={
        Name:        document.getElementById('vName').value.trim(),
        Phone:       document.getElementById('vPhone').value.trim(),
        VisitorType: document.getElementById('vType').value,
        Company:     document.getElementById('vCompany').value.trim(),
        Purpose:     document.getElementById('vPurpose').value,
        HostEmpID:   document.getElementById('vHost').value,
        IDType:      document.getElementById('vIDType').value,
        IDNumber:    document.getElementById('vIDNumber').value.trim(),
        Vehicle:     document.getElementById('vVehicle').value.trim(),
        PhotoData:   vPhotoData,
        SafetyAckAt: vSafetyAckAt
      };
      if(!v.Name || !v.Phone){ toast(qrattT('vreg_toast_required'),'error'); return; }
      if(!v.PhotoData){ toast(qrattT('vreg_toast_photo_required'),'error');
        var pb=document.getElementById('photoBox'); if(pb){ pb.scrollIntoView({block:'center'}); }
        return; }
      if(rulesRevealed < SAFETY_RULE_KEYS.length || !document.getElementById('vSafetyAck').checked){
        toast(qrattT('vreg_toast_rules_pending'),'error'); return;
      }
      var btn=document.getElementById('regBtn');
      btn.removeAttribute('data-i18n');   // showing transient "Registering…" state, not the static label
      btn.textContent=qrattT('vreg_registering'); btn.disabled=true;

      function resetRegBtn(){
        btn.disabled=false;
        btn.setAttribute('data-i18n','vreg_register_btn');
        btn.textContent=qrattT('vreg_register_btn');
      }

      if(typeof google==='undefined' || !google.script){ toast('Not in app context','error'); resetRegBtn(); return; }
      google.script.run
        .withSuccessHandler(function(res){
          if(!res || !res.success){ toast('Error: '+((res&&res.error)||'unknown'),'error'); resetRegBtn(); return; }
          showDone(res.visitorId, res.returning);
        })
        .withFailureHandler(function(e){
          toast('Error: '+(e&&e.message||'server error'),'error');
          resetRegBtn();
        })
        .registerVisitor(v);
    }

    // Returning visitor: look up existing pass by phone, skip the form.
    function lookupReturning(){
      var phone=document.getElementById('rPhone').value.trim();
      if(!phone){ toast('Enter your mobile number','error'); return; }
      if(typeof google==='undefined' || !google.script){ toast('Not in app context','error'); return; }
      var b=document.getElementById('rBtn'); b.textContent='…'; b.disabled=true;
      google.script.run
        .withSuccessHandler(function(res){
          b.textContent='Find my pass'; b.disabled=false;
          if(!res || !res.success){ toast((res&&res.error)||'Not found','error'); return; }
          document.getElementById('returnCard').style.display='none';
          showDone(res.visitorId, true);
        })
        .withFailureHandler(function(e){ b.textContent='Find my pass'; b.disabled=false; toast((e&&e.message)||'error','error'); })
        .lookupVisitorByPhone(phone);
    }

    // Confirmation: QR encodes the visitor ID (kiosk reads it as a badge).
    function showDone(visitorId, returning){
      document.getElementById('returnCard').style.display='none';
      document.getElementById('formCard').style.display='none';
      var titleEl=document.getElementById('doneTitle'), subEl=document.getElementById('doneSub');
      // Returning visitors see different copy; swap the i18n key so language
      // toggles keep working, instead of hardcoding English text in place.
      titleEl.setAttribute('data-i18n', returning ? 'vreg_done_returning_title' : 'vreg_done_title');
      subEl.setAttribute('data-i18n', returning ? 'vreg_done_returning_sub' : 'vreg_done_subline');
      titleEl.textContent=qrattT(titleEl.getAttribute('data-i18n'));
      subEl.textContent=qrattT(subEl.getAttribute('data-i18n'));
      document.getElementById('doneVid').textContent=visitorId;
      document.getElementById('doneQR').src=
        'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(visitorId);
      var passBase = /^https?:\/\//.test(PUBLIC_URL) ? PUBLIC_URL : APP_URL;
      document.getElementById('doneLink').href=
        passBase+'?page=vpass&id='+encodeURIComponent(visitorId);
      document.getElementById('doneCard').style.display='block';
      window.scrollTo(0,0);
    }

    function closeReg(){
      // Close the tab/window; if the browser blocks it (not script-opened), blank the page.
      window.open('','_self'); window.close();
      document.body.innerHTML='<div style="font-family:sans-serif;text-align:center;padding:40px;color:#64748b">You may close this window.</div>';
    }
  </script>
</body>
</html>
