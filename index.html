<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="QR-based attendance and visitor management system.">
  <title>QR Att. — Attendance System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #07111F; font-family: system-ui, -apple-system, sans-serif; }

    #loader {
      position: fixed; inset: 0; background: #07111F;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      z-index: 10; transition: opacity 0.3s;
    }
    .loader-logo { display: flex; align-items: center; gap: 14px; }
    .loader-mark {
      width: 44px; height: 44px; background: #000666; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; color: #fff; letter-spacing: 1px;
    }
    .loader-name { font-weight: 800; font-size: 22px; color: #f1f5f9; letter-spacing: 2px; text-transform: uppercase; }
    .loader-sub { font-size: 11px; color: #8FA3BC; text-transform: uppercase; letter-spacing: 3px; margin-top: -22px; padding-left: 58px; }
    .loader-note { font-size: 12px; color: #8FA3BC; text-align: center; max-width: 260px; line-height: 1.5; min-height: 18px; padding: 0 16px; }
    .loader-bar { width: 180px; height: 2px; background: #1e293b; border-radius: 2px; overflow: hidden; }
    .loader-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #000666, #2563eb, #06b6d4);
      border-radius: 2px; animation: load 1.8s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes load { 0%{width:0%;opacity:1} 60%{width:75%} 85%{width:92%} 100%{width:100%} }
    .loader-dots { display: flex; gap: 6px; margin-top: -12px; }
    .loader-dots span { width: 5px; height: 5px; border-radius: 50%; background: #334155; animation: pulse 1.2s ease-in-out infinite; }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,100%{background:#334155;transform:scale(1)} 50%{background:#2563eb;transform:scale(1.4)} }

    /* The iframe sits BELOW the panel and never captures taps. If Google ever
       allows framing again, `showApp()` lifts it above and re-enables input. */
    #app {
      position: fixed; inset: 0; z-index: 1;
      width: 100%; height: 100%; height: 100dvh;
      border: none; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    #app.ready { opacity: 1; z-index: 30; pointer-events: auto; }

    /* Launcher panel. Google currently refuses to render the web app in a frame
       (its auth interstitial sends X-Frame-Options: SAMEORIGIN), and a blocked
       cross-origin iframe is undetectable from here — so the portal shows this
       and opens the app directly. */
    #blocked {
      display: flex; position: fixed; inset: 0; z-index: 20; background: #07111F;
      align-items: center; justify-content: center; padding: 24px;
    }
    .bk-card { max-width: 380px; text-align: center; color: #e2e8f0; }
    .bk-mark {
      width: 52px; height: 52px; margin: 0 auto 16px; background: #000666; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px; color: #fff; letter-spacing: 1px;
    }
    .bk-title { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
    .bk-text { font-size: 13px; line-height: 1.65; color: #94a3b8; margin-bottom: 20px; }
    .bk-btn {
      display: block; padding: 14px; border-radius: 10px; background: #2563eb; color: #fff;
      font-size: 15px; font-weight: 700; text-decoration: none;
    }
    .bk-hint { font-size: 11px; color: #475569; margin-top: 14px; line-height: 1.6; }

    /* First-run language picker — tap targets kept >=44px for easy thumb taps. */
    .bk-lang { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; }
    .bk-lang-btn {
      min-width: 96px; min-height: 44px; padding: 10px 18px; border-radius: 10px;
      border: 1px solid #334155; background: #0f172a; color: #cbd5e1;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .bk-lang-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-logo">
      <div class="loader-mark">QR</div>
      <div class="loader-name">Att.</div>
    </div>
    <div class="loader-sub">Attendance System</div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <div class="loader-dots"><span></span><span></span><span></span></div>
    <!-- Filled in after a few seconds so a slow start reads as slow, not hung. -->
    <div id="loaderNote" class="loader-note" role="status" aria-live="polite"></div>
  </div>

  <iframe
    id="app"
    src=""
    allow="accelerometer; camera; encrypted-media; geolocation; gyroscope; microphone"
    allowfullscreen
  ></iframe>

  <!-- Shown when Google refuses to render the app in this frame (logged-in users
       get redirected to an auth page that sets X-Frame-Options: SAMEORIGIN). -->
  <div id="blocked">
    <div class="bk-card">
      <div class="bk-mark">QR</div>
      <div class="bk-title">QR Attendance</div>
      <div class="bk-lang" id="langPicker">
        <button type="button" class="bk-lang-btn" data-lang-choice="en">English</button>
        <button type="button" class="bk-lang-btn" data-lang-choice="hi">हिंदी</button>
      </div>
      <div class="bk-text">Tap below to open the attendance app.</div>
      <a id="blockedLink" class="bk-btn" href="#">Open the app →</a>
      <div class="bk-hint">Add this page to your home screen for quick access.</div>
    </div>
  </div>

  <script>
    (function() {
      var base = 'https://script.google.com/macros/s/AKfycbzkGp766lCPYqhitkbYsv0jQGPtBE_dLzpc3CiwuXIWmm7CbFps4XMTb5kmxLAryR0CMQ/exec';

      /* Every page the launcher may forward to. The visitor-facing ones were
         missing, which meant a pass link fell through to the default and put
         the visitor on the gate kiosk instead of their own pass. */
      var valid = ['scanner','dashboard','reports','visitors','kiosk','admin','idcards',
                   'vpass','vreg','gatepass_approve','people','training','kpi',
                   'induction','skillmatrix','mockdrill','assess','login',
                   // Reached by QR from the training page: a trainer shows the
                   // code and the room scans it, so these must resolve here.
                   'present','selftest'];

      /* Keep the WHOLE query string, not just ?page. publicPassUrl() emits
         ?page=vpass&id=VIS-… and the id is the only thing identifying the
         pass; reading page alone silently dropped it. */
      var qs   = new URLSearchParams(location.search);
      var page = qs.get('page') || 'kiosk';
      if (valid.indexOf(page) === -1) page = 'kiosk';
      qs.set('page', page);

      // Cache-buster that rotates DAILY. The GAS app already sends no-store, but
      // Chrome mobile still served a stale copy of the exact app URL because the
      // old buster was a hardcoded '&v=100' that never changed — so a deploy left
      // users on yesterday's cached page until they cleared history. A per-day
      // token means every day's first open fetches fresh, without busting the
      // cache on every single tap (which would slow every launch).
      var appVer = 'd' + Math.floor(Date.now() / 86400000); // days since epoch

      // Language choice persists across launcher visits (own origin only —
      // script.google.com can't read this localStorage, so it's forwarded
      // via ?lang= on every app URL instead).
      var chosenLang = localStorage.getItem('qratt_lang') === 'hi' ? 'hi' : 'en';

      /* Builds on the incoming query string so id, emp and anything else a
         link carries survives the hop. */
      function appUrl(pg) {
        var q = new URLSearchParams(qs.toString());
        if (pg) q.set('page', pg);
        q.set('v', appVer);
        q.set('lang', chosenLang);
        return base + '?' + q.toString();
      }

      // Reflect the current choice on the picker buttons, and re-point the
      // "Open the app" link whenever the visitor taps a different language.
      function renderLangPicker() {
        document.querySelectorAll('.bk-lang-btn').forEach(function(btn) {
          btn.classList.toggle('active', btn.getAttribute('data-lang-choice') === chosenLang);
        });
      }
      document.getElementById('langPicker').addEventListener('click', function(e) {
        var btn = e.target.closest('.bk-lang-btn');
        if (!btn) return;
        chosenLang = btn.getAttribute('data-lang-choice') === 'hi' ? 'hi' : 'en';
        localStorage.setItem('qratt_lang', chosenLang);
        renderLangPicker();
        document.getElementById('blockedLink').href = appUrl(page);
      });
      renderLangPicker();

      var app = document.getElementById('app');
      var loader = document.getElementById('loader');

      function loadPage(pg) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
        app.classList.remove('ready');
        app.src = appUrl(pg);
        // Track the page in the address bar without discarding the rest of the
        // query — an in-app hop should not strip an id the link arrived with.
        qs.set('page', pg);
        history.replaceState(null, '', '?' + qs.toString());
        // This hop has its own readiness; arm the watchers again for it.
        armLoadWatch();
      }

      /* The app runs INSIDE this page, so the address bar keeps saying
         packmastersmumbai.github.io/att for the whole session.

         An earlier attempt at this was reverted on the grounds that Google
         refuses to be framed. Re-measured against this deployment: /exec
         returns 200 with no X-Frame-Options, no CSP frame-ancestors and no
         redirect, and kiosk, dashboard and admin all render inside a frame on
         this origin with no refusal logged. The refusal belongs to the auth
         interstitial, which a web app deployed as ANYONE_ANONYMOUS does not
         serve.

         The card is kept as a fallback, not as the default: if the frame has
         painted nothing after 12s — Google changing its mind, a corporate
         proxy, a locked-down browser — it appears and offers the direct link,
         which is the old behaviour. */
      document.getElementById('blockedLink').href = appUrl(page);
      history.replaceState(null, '', '?' + qs.toString());

      var blocked = document.getElementById('blocked');
      blocked.style.display = 'none';

      app.src = appUrl(page);

      /* Per-NAVIGATION, not per-session. loadPage() raises the overlay again on
         every in-app hop, so a latch that never resets left the overlay up for
         good after the first page: clicking Dashboard changed the URL, loaded
         the frame, fired qratt_ready — and the user still stared at the
         spinner. Reset it wherever the overlay goes up. */
      var settled = false;
      function frameReady() {
        if (settled) return;
        settled = true;
        clearTimeout(fallbackTimer);
        clearInterval(tick);
        loader.style.opacity = '0';
        setTimeout(function () { loader.style.display = 'none'; }, 320);
        app.classList.add('ready');
      }

      /* The app tells us when it has painted (qratt_ready, posted from
         i18n.html, which doGet injects into every page). That is the only
         reliable signal: an earlier attempt polled iframe.contentDocument,
         which ALWAYS throws because GAS is cross-origin, so it silently fell
         back to the load event and held this overlay over an already-rendered
         dashboard for about five seconds.

         The load event stays as a backstop for anything that does not carry
         the shared fragment. */
      window.addEventListener('message', function (ev) {
        if (ev.data && ev.data.qratt_ready) frameReady();
      });

      app.addEventListener('load', function () { setTimeout(frameReady, 250); });

      var note = document.getElementById('loaderNote');
      var tick = null, fallbackTimer = null;

      /* Arm the watchers for ONE page load: the progress notes, and the
         give-up timer that falls back to the direct link. Called for the first
         page and again on every in-app hop, because each hop shows the overlay
         again and has its own readiness. */
      function armLoadWatch() {
        settled = false;
        clearInterval(tick);
        clearTimeout(fallbackTimer);
        if (note) note.textContent = '';

        /* A spinner that never changes reads as hung; the wait is real, so say
           so rather than hide it. */
        var waited = 0;
        tick = setInterval(function () {
          waited += 1;
          if (!note) return;
          if (waited === 4) note.textContent = 'Still loading — Google Apps Script is slow to start.';
          if (waited === 9) note.textContent = 'Taking longer than usual. Hold on…';
        }, 1000);

        fallbackTimer = setTimeout(function () {
          if (settled) return;
          settled = true;
          clearInterval(tick);
          loader.style.display = 'none';
          blocked.style.display = '';
          app.style.display = 'none';
        }, 20000);
      }
      armLoadWatch();

      /* Watchdog — the overlay must never outlive the page beneath it.

         The reveal depends on a qratt_ready message arriving after the frame
         has swapped. Message ordering across a cross-origin nested iframe is
         not something to bet a blank screen on: a ready fired for the OUTGOING
         page can land just after a hop is armed, consuming the reveal, and the
         incoming page's own message then finds settled already true. The
         observed symptom is a fully rendered Reports page sitting behind a
         spinner that never clears.

         So: once a second, if the overlay is up and the iframe has been sitting
         on the current page for more than three seconds, lower it. Costs
         nothing when the messages behave, and makes a stuck overlay
         impossible when they do not. */
      setInterval(function () {
        if (settled) return;
        if (loader.style.display === 'none') return;
        var want = appUrl(qs.get('page') || 'kiosk');
        if (app.getAttribute('src') !== want) return;   // still mid-swap
        if (!app.__since || app.__srcSeen !== want) {
          app.__srcSeen = want;
          app.__since = Date.now();
          return;
        }
        if (Date.now() - app.__since > 3000) frameReady();
      }, 1000);

      /* In-app navigation. The pages post here instead of navigating the top
         frame, which would break out of the launcher and put the raw
         script.google.com URL back in the address bar. */
      window.addEventListener('message', function(e) {
        if (!e.data || !e.data.qratt_nav) return;
        if (valid.indexOf(e.data.qratt_nav) === -1) return;

        /* Drop the record-scoped params of the page being left. Carrying an id
           from a visitor pass onto the dashboard would be meaningless at best,
           and on a page that reads id it would open the wrong record. */
        ['id', 'emp', 'plan', 'topic'].forEach(function(k) { qs.delete(k); });

        /* Tell the page we are handling it, which cancels the ordinary
           navigation it queued. The app cannot detect the launcher on its own:
           GAS always nests a sandbox iframe, so "am I framed" is true either
           way. This reply is the only reliable signal. */
        try { e.source && e.source.postMessage({ qratt_nav_ok: true }, '*'); } catch (ex) {}

        loadPage(e.data.qratt_nav);
        document.getElementById('blockedLink').href = appUrl(e.data.qratt_nav);
      });
    })();
  </script>
</body>
</html>
